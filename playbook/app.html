<title>HotS Drafter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a one-hand phone tool. Top tabs, a 16 slot board, one decision card at a time. Amethyst is us, burnt orange is them. Hero sheets slide up over any tab. */
:root {
  --bg: #F4F3F8; --surface: #FFFFFF; --surface2: #ECEAF3; --line: #D9D5E6; --ink: #1B1830; --muted: #5E5875;
  --us: #5B34A0; --us-soft: #E9E1F7; --them: #A84A12; --them-soft: #F7E6DA;
  --good: #1B6E46; --good-soft: #DDF1E6; --warn: #8F6200; --warn-soft: #F8EBC8; --bad: #B3261E; --bad-soft: #F9DEDB; --focus: #2F6FEB;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13101D; --surface: #1C1830; --surface2: #262140; --line: #38325C; --ink: #ECE9F7; --muted: #A59FBD;
    --us: #B99BF2; --us-soft: #2E2350; --them: #F0A06B; --them-soft: #3A2619;
    --good: #5FD39A; --good-soft: #17352A; --warn: #E3B44F; --warn-soft: #3B2F10; --bad: #FF8A80; --bad-soft: #3F1D1B; --focus: #7FA8FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13101D; --surface: #1C1830; --surface2: #262140; --line: #38325C; --ink: #ECE9F7; --muted: #A59FBD;
  --us: #B99BF2; --us-soft: #2E2350; --them: #F0A06B; --them-soft: #3A2619;
  --good: #5FD39A; --good-soft: #17352A; --warn: #E3B44F; --warn-soft: #3B2F10; --bad: #FF8A80; --bad-soft: #3F1D1B; --focus: #7FA8FF; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 0 40px; }
* { box-sizing: border-box; }
.wrap { max-width: 760px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: 0.01em; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
p { margin: 0.4em 0; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 8px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.brand h1 { font-size: 1.6rem; }
.brand small { color: var(--muted); font-size: 0.78rem; }
.tabs { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--us); color: var(--bg); border-color: var(--us); }
.tabs.small .tab { padding: 6px 12px; min-height: 36px; font-size: 0.86rem; }
main { padding-top: 14px; display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card.us { border-color: var(--us); } .card.them { border-color: var(--them); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 160px; min-width: 0; }
.muted { color: var(--muted); } .small { font-size: 0.82rem; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
label.f { display: grid; gap: 4px; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
select, input[type="text"], input[type="search"] { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-height: 42px; color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; min-height: 42px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--us); color: var(--bg); border-color: var(--us); }
.btn.them { background: var(--them); color: var(--bg); border-color: var(--them); }
.btn.sm { padding: 5px 10px; min-height: 34px; font-size: 0.84rem; }
.btn.big { padding: 14px 16px; min-height: 52px; flex: 1 1 200px; text-align: left; }
.btn small { display: block; font-weight: 400; opacity: 0.9; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.slot { border: 1px solid var(--line); border-radius: 8px; padding: 6px 7px; min-height: 52px; background: var(--surface); position: relative; overflow: hidden; text-align: left; display: block; width: 100%; }
button.slot { cursor: pointer; }
.slot b { font-family: var(--mono); font-size: 0.62rem; color: var(--muted); font-weight: 500; white-space: nowrap; display: block; }
.slot span { display: block; font-weight: 600; font-size: 0.78rem; overflow-wrap: break-word; line-height: 1.15; }
.slot.us { border-left: 4px solid var(--us); } .slot.opp { border-left: 4px solid var(--them); }
.slot.ban span { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
.slot.now { outline: 3px solid var(--focus); outline-offset: 1px; }
.slot.sim span { font-style: italic; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--surface2); }
.tag.good { background: var(--good-soft); color: var(--good); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.us { background: var(--us-soft); color: var(--us); } .tag.them { background: var(--them-soft); color: var(--them); }
.tier { display: inline-block; min-width: 24px; text-align: center; font-family: var(--mono); font-weight: 700; border-radius: 6px; padding: 1px 6px; font-size: 0.78rem; background: var(--surface2); }
.tier.tS { background: var(--good-soft); color: var(--good); } .tier.tA { background: var(--us-soft); color: var(--us); } .tier.tB { background: var(--surface2); color: var(--muted); }
.tier.tSSS { background: var(--good); color: var(--bg); } .tier.tF { background: var(--bad); color: var(--bg); }
.tier.tC { background: var(--warn-soft); color: var(--warn); } .tier.tD { background: var(--bad-soft); color: var(--bad); }
.rec { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); }
.rec.first { border-color: var(--us); box-shadow: inset 4px 0 0 var(--us); }
.rec.skip { opacity: 0.8; }
.rec h3 { font-size: 1.4rem; }
.bar-score { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar-score i { display: block; height: 100%; background: var(--us); }
details summary { cursor: pointer; font-size: 0.85rem; color: var(--muted); min-height: 28px; }
details.sec { border-top: 1px solid var(--line); padding-block: 4px; }
details.sec > summary { font-weight: 600; color: var(--ink); font-size: 0.95rem; padding-block: 6px; }
ul.r { margin: 6px 0 0; padding-left: 18px; } ul.r li { margin: 2px 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.scroll { overflow-x: auto; }
.meter { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.meter div { background: var(--surface2); border-radius: 8px; padding: 8px 10px; }
.meter b { font-family: var(--mono); font-size: 1.3rem; display: block; } .meter span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.note h2, .note h3 { margin-top: 10px; } .note ul { padding-left: 18px; }
.warnbox { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
.err { color: var(--bad); font-size: 0.86rem; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 0.82rem; font-weight: 600; min-height: 34px; cursor: pointer; }
.chip.pool { border-color: var(--us); background: var(--us-soft); }
.chip.on { background: var(--us); color: var(--bg); border-color: var(--us); }
.chip.used { opacity: 0.5; text-decoration: line-through; }
button.hl { background: none; border: 0; padding: 0; margin: 0; font-weight: 700; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-height: 48px; cursor: pointer; }
.hrow .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.hlist { display: grid; gap: 6px; }
.prose p { margin: 0.55em 0; } .prose h3 { margin-top: 12px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.cols ul { margin: 4px 0 0; padding-left: 18px; }
.tal { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.tal .lv { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.opt { padding: 6px 0; } .opt + .opt { border-top: 1px dashed var(--line); }
.mk { display: inline-block; width: 1.4em; text-align: center; font-weight: 700; }
.mk.y { color: var(--good); } .mk.m { color: var(--muted); } .mk.n { color: var(--bad); }
code.code { font-family: var(--mono); background: var(--surface2); border-radius: 6px; padding: 3px 8px; word-break: break-all; }
.rb { display: inline-flex; gap: 2px; vertical-align: middle; } .rb i { width: 14px; height: 8px; border-radius: 2px; background: var(--surface2); } .rb i.on { background: var(--us); }
dialog.sheet { border: 0; padding: 0; width: min(760px, 100%); max-width: 100%; height: min(92vh, 100%); max-height: 100%; margin: auto auto 0; border-radius: 14px 14px 0 0; background: var(--bg); color: var(--ink); box-shadow: 0 -6px 28px rgba(0, 0, 0, 0.35); overflow: hidden; }
dialog.sheet[open] { display: flex; flex-direction: column; }
dialog.sheet::backdrop { background: rgba(10, 8, 20, 0.6); }
.sheet-head { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.sheet-body { padding: 12px 14px 32px; overflow-y: auto; flex: 1; display: grid; gap: 12px; align-content: start; }
.sheet-body > * { min-width: 0; }
@media (min-width: 640px) { .board { grid-template-columns: repeat(8, minmax(0, 1fr)); } dialog.sheet { margin: auto; border-radius: 14px; height: min(90vh, 100%); } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<div class="wrap">
  <div class="bar">
    <div class="brand"><h1 id="brand">HotS Drafter</h1><small id="stamp"></small></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <main id="view"></main>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<dialog class="sheet" id="picker" aria-labelledby="picker-title"></dialog>

<script>/*DATA*/</script>
<script>/*LIB*/</script>
<script>/*ENGINE*/</script>
<script>
(function () {
  "use strict";
  const P = window.PLAYBOOK, E = window.Engine;
  const LIB = window.LIBRARY || { heroes: {}, maps: {}, guides: [], glossary: [], facts: [], tips: "" };
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const keyOf = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const heroKey = {}; Object.keys(P.heroes).forEach(h => { heroKey[keyOf(h)] = h; });
  // The tool ships with one hand tuned team (P.us, P.teams) and, when the league data is there, every NGS team (P.league).
  // applyTeam() points P.us, P.teams and the map numbers at whichever team is picked.
  const CUR = { us: P.us, teams: P.teams, map_hero: P.our_map_hero, map_stats: P.map_stats, map_bans: P.map_bans, next: P.meta.next_opponent };
  const LG = P.league || null;
  let opponents = [];
  const SAVE = "ngs-draft-room-v2";
  const ROLES = ["Tank", "Bruiser", "Melee Assassin", "Ranged Assassin", "Healer", "Support"];
  let ui = { tab: "draft", team: CUR.us.team, me: null, mypool: {}, teamPicked: false, series: [], aliasOff: {}, ngsSeasons: ["22"], stages: ["reg", "po"], slScopes: ["recent", "mmr"], opp: null, side: null, map: null, mapBans: { us: ["", ""], opp: ["", ""] }, actions: [], sim: null, msg: "", showAll: false,
    mapview: null, hq: "", hrole: "All", hscope: "general", hpool: false, hsort: "name", ltab: "tips", gq: "", pq: "", prole: "All" };

  // Point the page at the picked team: its roster and pools, the opponents of its division, and the head to head numbers against each.
  function applyTeam() {
    const emptyVs = () => ({ h2h: [], bans_vs_us: {}, bans_r2_vs_us: {}, bans_games_vs_us: 0, hero_picks_vs_us: {}, our_heroes_vs_them: {} });
    let us, teams, mh, ms, mb;
    if (!LG || ui.team === CUR.us.team || !LG.profiles[ui.team]) {
      ui.team = CUR.us.team;
      us = JSON.parse(JSON.stringify(CUR.us)); mh = CUR.map_hero; ms = CUR.map_stats; mb = CUR.map_bans;
      teams = Object.assign({}, CUR.teams);
      // other divisions too (no games against us, so head to head is empty), when the league data is there
      if (LG) Object.keys(LG.teams).forEach(t => { if (!teams[t]) teams[t] = Object.assign({ notes: "" }, LG.teams[t], emptyVs()); });
    } else {
      us = Object.assign({}, CUR.us, JSON.parse(JSON.stringify(LG.profiles[ui.team])));
      teams = {};
      Object.keys(LG.teams).forEach(t => { teams[t] = Object.assign({ notes: "" }, LG.teams[t], t === ui.team ? emptyVs() : (LG.pairs[t + "|" + ui.team] || emptyVs())); });
      mh = LG.map_hero[ui.team] || {}; ms = LG.map_stats; mb = LG.map_bans;
    }
    // the person using the tool: their own pool entries replace what is guessed for them
    if (ui.me) { const me = us.players.find(p => p.tag === ui.me); if (me) Object.keys(ui.mypool || {}).forEach(h => { if (P.heroes[h]) { if (ui.mypool[h] === "none") delete me.pool[h]; else me.pool[h] = ui.mypool[h]; } }); }
    // Data window: which NGS seasons and which Storm League scopes the numbers are built from.
    const has = k => ui.ngsSeasons.indexOf(k) >= 0;
    us.players.forEach(p => {
      if (p.ngs_by) {
        const out = {}, keys = [];
        ui.ngsSeasons.forEach(k => { if (k === "old") { keys.push(k); return; } if (ui.stages.indexOf("reg") >= 0) keys.push(k); if (ui.stages.indexOf("po") >= 0) keys.push(k + "p"); });
        keys.forEach(k => Object.keys(p.ngs_by[k] || {}).forEach(h => {
          const x = p.ngs_by[k][h], o = out[h];
          if (!o) out[h] = { g: x.g, w: x.w, rating: x.rating == null ? 0 : x.rating, deaths: x.deaths || 0 };
          else { const n = o.g + x.g; o.deaths = Math.round(10 * ((o.deaths * o.g) + ((x.deaths || 0) * x.g)) / n) / 10; o.g = n; o.w += x.w; }
        }));
        p.ngs = out;
      }
      // Storm League hero numbers: the chosen seasons, or the recent window the tool was built with, or nothing at all
      const sets = ui.slScopes.filter(k => k !== "recent" && k !== "mmr");
      if (sets.length && p.sl_scopes) {
        const hs = {};
        sets.forEach(k => Object.keys(p.sl_scopes[k] || {}).forEach(h => { const v = p.sl_scopes[k][h]; hs[h] = hs[h] ? [hs[h][0] + v[0], hs[h][1] + v[1]] : [v[0], v[1]]; }));
        p.sl = { since: sets.map(k => k === "all" ? "all time" : "season " + k.slice(1)).join(" + "), heroes: hs, by_map: {}, map_all: {} };
      } else if (sets.length || ui.slScopes.indexOf("recent") < 0) {
        p.sl = null;
      }
      if (ui.slScopes.indexOf("mmr") < 0) delete p.sl_mmr;
    });
    if (!(ui.ngsSeasons.length === 1 && has("22") && ui.stages.indexOf("reg") >= 0)) {
      const view = {};
      const reg = ui.stages.indexOf("reg") >= 0, po = ui.stages.indexOf("po") >= 0;
      Object.keys(teams).forEach(name => {
        const tm = teams[name], pl = {};
        Object.keys(tm.players || {}).forEach(tag => {
          const q = tm.players[tag], L = LG && LG.teams[name] && LG.teams[name].players[tag];
          const hs = {};
          // this season's saved games are regular season (no playoffs played yet)
          if (has("22") && reg) Object.keys(q.heroes || {}).forEach(h => { hs[h] = Object.assign({}, q.heroes[h]); });
          const addPrev = prev => { if (prev) Object.keys(prev).forEach(h => {
            const x = prev[h];
            if (hs[h]) { hs[h].g += x.g; hs[h].w += x.w; } else hs[h] = { g: x.g, w: x.w, rating: 60, deaths: x.deaths || 0, dmg: 0, others_avg: null, weak: false };
          }); };
          if (has("21") && reg && L) addPrev(L.prev_heroes);
          if (has("21") && po && L) addPrev(L.prev_heroes_p);
          if (has("old") && L) addPrev(L.old_heroes);
          const sorted = {}; Object.keys(hs).sort((a, b) => hs[b].g - hs[a].g).forEach(h => { sorted[h] = hs[h]; });
          pl[tag] = Object.assign({}, q, { heroes: sorted });
        });
        view[name] = Object.assign({}, tm, { players: pl });
      });
      teams = view;
    }
    if (ui.slScopes.indexOf("mmr") < 0) {
      const bare = {};
      Object.keys(teams).forEach(name => {
        const tm = teams[name], pl = {};
        Object.keys(tm.players || {}).forEach(tag => { const q = Object.assign({}, tm.players[tag]); delete q.sl_mmr; pl[tag] = q; });
        bare[name] = Object.assign({}, tm, { players: pl });
      });
      teams = bare;
    }
    P.us = us; P.teams = teams; P.our_map_hero = mh; P.map_stats = ms; P.map_bans = mb;
    P.meta.next_opponent = ui.team === CUR.us.team ? CUR.next : null;
    const myDiv = LG && LG.divisions ? LG.divisions[us.team] : null;
    opponents = Object.keys(teams).filter(t => t !== us.team).sort((a, b) => {
      const sa = LG && LG.divisions[a] === myDiv ? 0 : 1, sb = LG && LG.divisions[b] === myDiv ? 0 : 1;
      return sa - sb || a.localeCompare(b);
    });
    if (!ui.opp || !teams[ui.opp] || ui.opp === us.team) ui.opp = (P.meta.next_opponent && teams[P.meta.next_opponent]) ? P.meta.next_opponent : opponents[0];
  }

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE) || "null");
      if (s) {
        ui.team = s.team || ui.team; ui.me = s.me || null; ui.mypool = s.mypool || {}; ui.teamPicked = !!s.teamPicked; ui.aliasOff = s.aliasOff || {}; ui.series = s.series || []; ui.ngsSeasons = (s.ngsSeasons && s.ngsSeasons.length) ? s.ngsSeasons : ["22"]; ui.slScopes = (s.slV2 && Array.isArray(s.slScopes)) ? s.slScopes : ["recent", "mmr"]; ui.stages = (s.stages && s.stages.length) ? s.stages : ["reg", "po"];
        applyTeam();
        if (s.opp && P.teams[s.opp] && s.opp !== P.us.team) { ui.opp = s.opp; ui.side = s.side; ui.map = s.map; ui.actions = s.actions || []; if (s.mapBans && s.mapBans.us && s.mapBans.opp) ui.mapBans = s.mapBans; }
        ui.tab = s.tab || "draft";
      }
    } catch (e) { /* storage unavailable */ }
    // HotS Tools personal edition: start on the owner's team and name, unless a saved choice already set them
    const pre = window.HOTS_PRESET;
    if (pre && pre.team && !ui.teamPicked && (pre.team === CUR.us.team || (LG && LG.profiles[pre.team]))) {
      ui.team = pre.team; ui.me = pre.me || null; ui.teamPicked = true;
    }
    applyTeam();
  }
  function save() { try { localStorage.setItem(SAVE, JSON.stringify({ team: ui.team, me: ui.me, mypool: ui.mypool, teamPicked: ui.teamPicked, series: ui.series, aliasOff: ui.aliasOff, ngsSeasons: ui.ngsSeasons, stages: ui.stages, slScopes: ui.slScopes, slV2: true, opp: ui.opp, side: ui.side, map: ui.map, mapBans: ui.mapBans, actions: ui.actions, tab: ui.tab })); } catch (e) { /* ignore */ } }
  function state() { return { opp: ui.opp, side: ui.side || "first", map: ui.map, actions: ui.actions, series: ui.series }; }

  const TABS = [["draft", "Draft"], ["overview", "Prep"], ["heroes", "Heroes"], ["maps", "Maps"], ["learn", "Learn"], ["team", "Team"], ["about", "About"]];
  function renderTabs() {
    $("#tabs").innerHTML = TABS.map(t => `<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${ui.tab === t[0]}">${t[1]}</button>`).join("");
    $("#brand").textContent = "HotS Drafter";
    $("#stamp").textContent = `${P.us.team} · NGS S${ui.ngsSeasons.slice().sort().join("+")}${ui.stages.length === 1 ? (ui.stages[0] === "po" ? " playoffs" : " regular") : ""} · SL ${ui.slScopes.filter(k => k !== "mmr").join("+") || "off"}${ui.slScopes.indexOf("mmr") >= 0 ? " + MMR" : ""} · ${P.meta.games} games to ${P.meta.newest_date} UTC`;
  }

  // ---------------------------------------------------------------- small renderers and hero helpers
  function md(text) {
    if (!text) return "";
    const out = []; let inList = false;
    const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
    text.split("\n").forEach(line => {
      const t = line.trim();
      if (/^[-*] /.test(t)) { if (!inList) { out.push("<ul>"); inList = true; } out.push("<li>" + inline(t.slice(2)) + "</li>"); return; }
      if (inList) { out.push("</ul>"); inList = false; }
      if (/^## /.test(t)) out.push("<h3>" + inline(t.slice(3)) + "</h3>");
      else if (/^# /.test(t)) out.push("<h2>" + inline(t.slice(2)) + "</h2>");
      else if (t) out.push("<p>" + inline(t) + "</p>");
    });
    if (inList) out.push("</ul>");
    return out.join("");
  }
  const paras = t => String(t || "").split("\n\n").filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
  const rec = E.rec;
  function recText(v) { return v && v[0] ? rec(v) : "0-0"; }
  const lh = h => LIB.heroes[h] || null;
  const roleOf = h => (P.heroes[h] && P.heroes[h].role) || "Unknown";
  const iceRole = r => r === "Bruiser" ? "Offlaner" : r;
  const RANK = { SSS: -1, S: 0, A: 1, B: 2, C: 3, D: 4, F: 5 };
  const rk = t => (t in RANK ? RANK[t] : 9);
  const prettyDate = s => { if (!s) return "unknown"; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return s; return ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][+m[2] - 1] + " " + (+m[3]) + " " + m[1]; };
  function scopeSlug(scope) { if (scope === "general" || scope === "master") return scope; return LIB.maps[scope] ? LIB.maps[scope].slug : scope; }
  function tierRows(h, scope) {
    const d = lh(h); if (!d) return [];
    if (scope === "fan") return d.fan || [];
    const s = scopeSlug(scope);
    const t = (s === "general" || s === "master") ? d.tiers[s] : (d.tiers.maps[s] || {});
    return Object.values(t || {});
  }
  function mainTier(h, scope) {
    const rows = tierRows(h, scope); if (!rows.length) return null;
    return rows.find(r => r.role === (scope === "fan" ? roleOf(h) : iceRole(roleOf(h)))) || rows.slice().sort((a, b) => rk(a.tier) - rk(b.tier))[0];
  }
  const tierTag = t => t ? `<span class="tier t${t.tier}" title="Icy Veins tier ${t.tier} as ${esc(t.role)}">${t.tier}</span>` : "";
  function poolOf(h) { return P.us.players.filter(p => p.pool[h]).map(p => ({ label: p.label, tier: p.pool[h], tag: p.tag })); }
  const heroBtn = h => `<button class="hl" data-hero="${esc(h)}">${esc(h)}</button>`;
  function chip(h, used, tier) {
    const pl = poolOf(h), gone = used && used.has(h);
    return `<button class="chip ${pl.length ? "pool" : ""} ${gone ? "used" : ""}" data-hero="${esc(h)}">${esc(h)}${tier ? ` <span class="tier t${tier}">${tier}</span>` : ""}${pl.length ? ` <span class="small muted">${pl.map(x => esc(x.label)).join(", ")}</span>` : ""}${gone ? ` <span class="small">(gone)</span>` : ""}</button>`;
  }
  const usedSet = () => ui.side ? E.used(state()) : null;
  const mapNames = () => Array.from(new Set(Object.keys(P.maps).concat(Object.keys(LIB.maps)))).sort();

  // Role split from a hero -> {g, w} table: games, main role, off role (only when it is a real second role), and flex picks.
  const wrTxt = (w, g) => g ? `${w}-${g - w} ${Math.round(100 * w / g)}%` : "";
  function roleSummary(heroes) {
    const by = {}; let g = 0, w = 0;
    Object.keys(heroes || {}).forEach(h => {
      const n = heroes[h], a = (P.heroes[h] && P.heroes[h].arch) || "Unknown";
      by[a] = by[a] || { g: 0, w: 0, heroes: {} };
      by[a].g += n.g; by[a].w += n.w; by[a].heroes[h] = n.g; g += n.g; w += n.w;
    });
    const order = Object.keys(by).sort((a, b) => by[b].g - by[a].g);
    const main = order[0] || "";
    const second = order[1];
    const off = second && by[second].g >= 3 && by[second].g / g >= 0.15 ? second : "";
    const flex = order.slice(1).map(a => `${a} ${by[a].g} (${Object.keys(by[a].heroes).sort((x, y) => by[a].heroes[y] - by[a].heroes[x]).slice(0, 3).join(", ")})`);
    return { g, w, main, off, flex, by };
  }
  // one hero with its NGS record and win rate, plus Storm League when we have it
  function heroWr(h, ngs, sl) {
    let t = `${esc(h)} ${ngs ? wrTxt(ngs.w, ngs.g) : ""}`;
    if (sl && sl[0] >= 8) t += ` <span class="muted">· SL ${Math.round(100 * sl[1] / sl[0])}% (${sl[0]})</span>`;
    return t;
  }

  // Opponent dropdown: the team's own division first, then every other division.
  function oppOptions() {
    const myDiv = LG && LG.divisions ? LG.divisions[P.us.team] : null;
    const same = opponents.filter(o => !LG || LG.divisions[o] === myDiv), other = opponents.filter(o => LG && LG.divisions[o] !== myDiv);
    const opt = o => `<option ${o === ui.opp ? "selected" : ""}>${esc(o)}</option>`;
    if (!other.length) return opponents.map(opt).join("");
    return `<optgroup label="Your division${myDiv ? " (" + esc(myDiv) + ")" : ""}">${same.map(opt).join("")}</optgroup><optgroup label="Other divisions">${other.map(o => `<option value="${esc(o)}" ${o === ui.opp ? "selected" : ""}>${esc(o)} (${esc(LG.divisions[o])})</option>`).join("")}</optgroup>`;
  }

  // ---------------------------------------------------------------- DRAFT TAB
  const allMapBans = () => ui.mapBans.us.concat(ui.mapBans.opp).filter(Boolean);
  // Each team bans two maps before the map is picked. Enter them here; the map list and the map pick advice follow.
  function mapBanBlock() {
    const pool = Object.keys(P.maps).sort(), mp = E.mapPlan(ui.opp), habit = (P.map_bans && P.map_bans[ui.opp]) || { bans: {}, series: 0 };
    const sel = (team, i) => {
      const taken = allMapBans().filter(m => m !== ui.mapBans[team][i]);
      return `<select data-mapban="${team}:${i}"><option value="">Not set</option>${pool.filter(m => !taken.includes(m)).map(m => `<option ${m === ui.mapBans[team][i] ? "selected" : ""}>${esc(m)}</option>`).join("")}</select>`;
    };
    const dup = ui.mapBans.us.filter(Boolean).length + ui.mapBans.opp.filter(Boolean).length;
    const left = E.mapChoices(ui.opp, allMapBans());
    const theirHabit = Object.keys(habit.bans).sort((a, b) => habit.bans[b] - habit.bans[a]).slice(0, 4).map(m => `${esc(m)} ${habit.bans[m]}`).join(", ");
    const picker = ui.side === "first" ? "they pick the map" : ui.side === "second" ? "we pick the map" : "map picker not set (set first pick below)";
    return `<h3 style="margin-top:12px">Map bans</h3>
      <div class="row">
        <div class="grow"><b class="small">Our two bans</b><div class="row">${sel("us", 0)}${sel("us", 1)}</div></div>
        <div class="grow"><b class="small">Their two bans</b><div class="row">${sel("opp", 0)}${sel("opp", 1)}</div></div>
      </div>
      <p class="small muted">Suggested for us: <b>${mp.bans.map(esc).join(" and ") || "none yet"}</b>. They usually ban: ${theirHabit || "no history"} (over ${habit.series} series). ${picker}.</p>
      ${dup >= 2 ? `<p class="small">Maps left, best for us first (${picker}): ${left.slice(0, 6).map(m => `<button class="btn sm" data-setmap="${esc(m.map)}">${esc(m.map)} <span class="muted">${recText(m.us)} v ${recText(m.them)}</span></button>`).join(" ")}</p>` : ""}`;
  }

  function setupCard() {
    const t = E.tossAdvice(ui.opp);
    const pickTxt = t.pick === "first" ? "Take <b>first pick</b>" : t.pick === "map" ? "Take the <b>map pick</b>" : "A <b>toss up</b>";
    const close = Math.abs(t.edgeFirst - t.edgeMap) < 0.12 ? " It is close, so use the notes." : "";
    const h2 = t.h2h;
    return `<details class="card" ${ui.actions.length ? "" : "open"}><summary><b>Setup</b> <span class="muted small">${esc(ui.opp)} · ${ui.side ? (ui.side === "first" ? "we have first pick" : "they have first pick") : "toss not set"} · ${ui.map ? esc(ui.map) : "map not set"}</span></summary>
      <div class="row" style="margin-top:8px">
        <label class="f grow">Opponent<select id="opp">${oppOptions()}</select></label>
        <label class="f grow">Map (when known)<select id="map"><option value="">Not set yet</option>${Object.keys(P.maps).sort().filter(m => !allMapBans().includes(m) || m === ui.map).map(m => `<option ${m === ui.map ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></label>
      </div>
      ${mapBanBlock()}
      <h3 style="margin-top:12px">Coin toss</h3>
      <p class="small muted">If we win the toss: ${pickTxt} against ${esc(ui.opp)}.${close}
        We are ${rec(t.usFirst)} with first pick and ${rec(t.usMap)} with the map pick. They are ${rec(t.themFirst)} with first pick and ${rec(t.themMap)} when they pick the map.
        Head to head: ${rec(h2.first)} when we had first pick, ${rec(h2.map)} when they did.</p>
      <div class="row" style="margin-top:8px">
        <button class="btn big ${ui.side === "first" ? "primary" : ""}" data-side="first">We have first pick<small>They pick the map. We ban 1, 3, 11 and pick 5, 8, 9, 14, 15.</small></button>
        <button class="btn big ${ui.side === "second" ? "primary" : ""}" data-side="second">They have first pick<small>We pick the map. We ban 2, 4, 10 and pick 6, 7, 12, 13, 16.</small></button>
      </div>
    </details>`;
  }

  function boardCard(st) {
    const plan = E.plan(st.side);
    const sim = ui.sim;
    const cells = plan.map((s, i) => {
      const a = st.actions[i] || (sim && sim.actions[i]);
      const now = !sim || st.actions[i] ? i === st.actions.length : false;
      const cls = ["slot", s.team === "us" ? "us" : "opp", s.type, now ? "now" : "", a && !st.actions[i] ? "sim" : ""].join(" ");
      const inner = `<b>${s.slot} ${s.team === "us" ? "US" : "THEM"} ${s.type.toUpperCase()}</b><span>${a && a.hero ? esc(a.hero) : "&nbsp;"}</span>`;
      return a && a.hero && P.heroes[a.hero] ? `<button class="${cls}" data-hero="${esc(a.hero)}" aria-label="Slot ${s.slot}, ${s.team === "us" ? "our" : "their"} ${s.type}, ${esc(a.hero)}. Open hero info.">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
    }).join("");
    return `<section class="card"><div class="board">${cells}</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-act="undo" ${st.actions.length ? "" : "disabled"}>Undo last</button>
      <button class="btn" data-act="sim">${ui.sim ? "Hide projection" : "Project the rest"}</button><button class="btn" data-act="reset">Reset draft</button></div>
      ${ui.sim ? `<p class="small muted">Italic names are a projection: the opponent does what they usually do and we take our top recommendation each time.</p>` : ""}</section>`;
  }

  // The numbers and conditions behind a recommendation: win rates with sample sizes, partners, kit combos, how it fits their style.
  function intelBlock(r, type, st) {
    const it = r.intel;
    if (!it) return "";
    const h = it.headline, chips = [];
    const wl2 = v => v[1] + "-" + (v[0] - v[1]);
    if (h.theirs && h.theirs[0]) chips.push(`<span class="tag">${type === "ban" ? esc(st.opp) + " with it" : "Us with it"} ${wl2(h.theirs)}</span>`);
    else chips.push(`<span class="tag">${type === "ban" ? "not played by them" : "no games yet"}</span>`);
    if (h.vsUs) chips.push(`<span class="tag">vs us ${wl2(h.vsUs)}</span>`);
    if (h.ours) chips.push(`<span class="tag">we are ${wl2(h.ours)} against it</span>`);
    if (h.global != null) chips.push(`<span class="tag">Storm League ${Math.round(h.global * 10) / 10}%</span>`);
    const sec = (title, list) => list && list.length ? `<b class="small">${title}</b><ul class="r small">${list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
    return `<div class="row" style="gap:4px">${chips.join(" ")}</div>
      <details><summary>${type === "ban" ? "Ban dossier" : "Numbers and combos"}</summary>
        ${sec("Win rates", it.numbers)}${sec("Conditions", it.conditions)}${sec("Combos and partners", it.combos)}${sec("Style", it.style)}
        <p class="small muted">Counts come from this season's games on record, so most rest on 2 to 8 games. Lines that start with "Kit suggests" come from the hero's kit, not from games we saw.</p>
      </details>`;
  }

  // Their side of the ban: which of our heroes they are likely to be worried about, and the numbers or combos behind it.
  function fearCard(st) {
    const list = E.fearList(st).slice(0, 6);
    if (!list.length) return "";
    return `<details class="card them"><summary><b>What they may be worried about</b> <span class="muted small">our heroes ranked by how much damage they have done, their history of banning them, and combos</span></summary>
      ${list.map(f => `<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px"><div class="row" style="justify-content:space-between"><span>${heroBtn(f.hero)} <span class="muted small">${(f.who || []).slice(0, 2).map(w => esc(w.label)).join(", ")}</span></span></div>
        <ul class="r small">${f.intel.numbers.concat(f.intel.conditions, f.intel.combos).slice(0, 7).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}
      <p class="small muted">From our own game log against theirs. "Kit suggests" lines are about the hero's kit, not something we saw them react to.</p></details>`;
  }

  function recCard(r, i, type, st) {
    const pct = Math.max(4, Math.min(100, r.score * 10));
    const who = (r.who || []).slice(0, 3).map(w => `<span class="tag us">${esc(w.label)} ${esc(w.tier)}</span>`).join(" ");
    const flags = (r.flags || []).map(f => `<span class="tag ${/LOCK NOW|COUNTERED|OVER RANGED/.test(f) ? "bad" : /DO NOT|LEAVE|LOW VALUE/.test(f) ? "warn" : "good"}">${esc(f)}</span>`).join(" ");
    const reasons = (r.reasons || []).filter(Boolean);
    const skip = (r.flags || []).some(f => /DO NOT|LEAVE|LOW VALUE/.test(f));
    const tt = st.map ? mainTier(r.hero, st.map) : mainTier(r.hero, "general");
    return `<div class="rec ${i === 0 && !skip ? "first" : ""} ${skip ? "skip" : ""}">
      <div class="row" style="justify-content:space-between"><h3>${esc(r.hero)}</h3><span class="row" style="gap:6px"><span class="small muted">${st.map ? "map tier" : "general tier"}</span>${tierTag(tt)}<span class="num small muted">${r.score.toFixed(1)}</span></span></div>
      <div class="bar-score"><i style="width:${pct}%"></i></div>
      <div class="row">${who} ${flags}</div>
      ${intelBlock(r, type, st)}
      ${reasons.length ? `<details ${i === 0 ? "open" : ""}><summary>Why (${reasons.length})</summary><ul class="r small">${reasons.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
      <div class="row"><button class="btn primary" data-take="${esc(r.hero)}">${type === "ban" ? "We ban it" : "We pick it"}</button><button class="btn" data-hero="${esc(r.hero)}">Hero info</button></div>
    </div>`;
  }

  function turnCard(st) {
    const slot = E.nextSlot(st);
    if (!slot) return `<section class="card"><h2>Draft complete</h2>${finalCard(st)}</section>`;
    const what = slot.type === "ban" ? "ban" : "pick";
    const ours = slot.team === "us";
    let body = "";
    if (ours) {
      const list = (slot.type === "ban" ? E.recommendBans(st) : E.recommendPicks(st));
      const show = ui.showAll ? list.slice(0, 14) : list.slice(0, 5);
      body = show.map((r, i) => recCard(r, i, slot.type, st)).join("") +
        `<div class="row"><button class="btn" data-act="more">${ui.showAll ? "Show fewer" : "Show more options"}</button></div>`;
    } else {
      const ex = slot.type === "ban" ? E.expectOppBans(st) : null;
      const picks = slot.type === "pick" ? E.expectOppPicks(st).slice(0, 8) : null;
      const chips = (slot.type === "ban" ? (slot.slot <= 4 ? ex.round1 : ex.round2).slice(0, 8) : picks);
      body = `<p class="muted small">${slot.type === "ban" ? `Their usual ${slot.slot <= 4 ? "round one" : "round two"} bans (over ${ex.games} games, ${ex.gamesVsUs} against us). Tap what they actually did.` :
        "Their usual picks at this point. Tap what they actually did."}</p>
        <div class="row">${chips.map(c => `<button class="btn" data-take="${esc(c.hero)}">${esc(c.hero)} <span class="muted small">${slot.type === "ban" ? c.n + (c.vs ? " (" + c.vs + " vs us)" : "") : (c.player ? esc(c.player.tag) : c.g + " games") + (c.vsUs ? ", " + c.vsUs[0] + " vs us (" + c.vsUs[1] + "-" + (c.vsUs[0] - c.vsUs[1]) + ")" : "")}</span></button>`).join("")}</div>`;
    }
    return `<section class="card ${ours ? "us" : "them"}">
      <div class="row" style="justify-content:space-between"><h2>Slot ${slot.slot}: ${ours ? "our" : "their"} ${what}</h2><span class="tag ${ours ? "us" : "them"}">${ours ? "US" : "THEM"}</span></div>
      <div style="display:grid;gap:10px;margin-top:10px">${body}</div>
      ${!ours && slot.type === "ban" ? `<div style="margin-top:10px">${fearCard(st)}</div>` : ""}
      <div class="row" style="margin-top:12px"><label class="f grow">${ours ? "Pick any other hero" : "Something else"}<input type="text" id="free" list="heroes" placeholder="Type a hero" autocomplete="off"></label>
        <button class="btn ${ours ? "primary" : "them"}" data-act="free">Record</button>
        <button class="btn" data-act="browse">Browse all heroes</button>
        ${slot.type === "ban" ? `<button class="btn" data-take="No Pick">No ban (missed)</button>` : ""}</div>
      <datalist id="heroes">${Object.keys(P.heroes).sort().map(h => `<option value="${esc(h)}">`).join("")}</datalist>
      ${ui.msg ? `<p class="err">${esc(ui.msg)}</p>` : ""}
    </section>`;
  }

  // What the league's drafts did with this comp shape and ranged count (data.comps). Sample sizes shown, nothing claimed past them.
  function compLeague(st) {
    const c = P.comps;
    if (!c) return "";
    const rl = E.rangedLeague(st.map);
    if (!rl) return "";
    const m = (c.maps || {})[st.map] || {};
    const f = v => { const k = E.cell(v); return k ? `${Math.round(100 * k.wwr)}% <span class="muted">(${k.n})</span>` : "n/a"; };
    const fr = v => { const k = E.cell(v); return k && k.rn >= 15 ? `${Math.round(100 * k.rwr)}% <span class="muted">(${k.rn})</span>` : "n/a"; };
    const rows = ["0-1", "2", "3", "4+"].map(k => `<tr><td>${k} ranged</td><td class="num">${f((m.ranged || {})[k])}</td><td class="num">${f(c.all.ranged[k])}</td><td class="num">${fr(c.all.ranged[k])}</td></tr>`).join("");
    const hl = E.cell((c.all.healers || {})["2+"]), h1 = E.cell((c.all.healers || {})["1"]);
    const f2 = k => k ? `${Math.round(100 * k.wwr)}% over ${k.n}` : "n/a";
    return `<details class="sec" style="margin-top:8px"><summary>What the league's drafts did (NGS seasons 15 to ${c.newest}, ${c.sides.toLocaleString("en-US")} sides)</summary>
      <div class="scroll"><table><tr><th>Ranged heroes</th><th>On ${esc(st.map || "this map")}</th><th>Every map</th><th>Every map, newest ${c.recent_seasons} seasons</th></tr>${rows}</table></div>
      <p class="small muted">Win rate of the drafting side, with the number of sides in brackets. The first two columns weight newer seasons more (a game ${c.half_life} seasons old counts half); the last is only the newest ${c.recent_seasons} seasons. Close to 50% means the count alone did not decide games. Two healers: ${f2(hl)} against one healer: ${f2(h1)}. All NGS divisions, not only ours. The count stands in for wave clear and poke, it is not a cause.</p></details>`;
  }

  function ownerComboCard(st) {
    const cs = E.ownerCombos(st).filter(c => c.ready || c.answeredBy.length || c.missing.length === 1 || c.finishers.length);
    if (!cs.length) return "";
    return `<details class="sec" style="margin-top:8px" open><summary>Known combos and counters from Hunter's notes (${cs.length})</summary>${cs.map(c => `<p class="small"><b>${esc(c.name)}</b> ${c.ready ? '<span class="tag good">ready</span>' : '<span class="tag warn">needs ' + esc(c.missing.join("; ")) + '</span>'}${c.finishers.length ? " Finishers on board: " + c.finishers.map(esc).join(", ") + "." : ""}${c.answeredBy.length ? ' <span class="tag bad">answered by their ' + c.answeredBy.map(esc).join(", ") + "</span>" : ""}<br>${esc(c.text)}</p>`).join("")}</details>`;
  }

  function compCard(st) {
    const c = E.compSummary(st);
    const picks = E.picks(st, "us");
    const asg = E.bestAssign(picks, st.map);
    const theirs = E.picks(st, "opp");
    const rules = E.rulesFor(st).filter(r => r.kind === "note");
    return `<section class="card us"><h3>Our comp</h3>
      <div class="meter" style="margin-top:8px"><div><b>${c.ranged}</b><span>Ranged dealers</span></div><div><b>${c.meleeDealers}</b><span>Melee dealers</span></div><div><b>${c.marksmen}</b><span>Marksmen</span></div><div><b>${c.frontline}</b><span>Front</span></div><div><b>${c.healers}</b><span>Healer</span></div><div><b>${c.highClear}</b><span>Strong clear</span></div><div><b>${c.highDamage}</b><span>Damage dealers</span></div></div>
      <p class="small muted">Strong clear is 3,500+ minion damage a minute, damage dealer is 2,400+ hero damage a minute (this division).</p>

  // ---------------------------------------------------------------- league read (the HotS Tools league engine, present when embedded)

  const pc = (v, d) => v == null ? "n/a" : (v * 100).toFixed(d == null ? 0 : d) + "%";
  const basisTag = b => b ? `<span class="tag" title="${b === "data" ? "measured from games" : b === "kit" ? "read from ability text" : "authored rating"}">${esc(b)}</span>` : "";

  function leagueCard(st) {

    if (mine.length < 2 && theirs.length < 2) return "";

        ${rd.versusEnemy ? `<p class="small">Our style against theirs (${esc(rd.versusEnemy.enemyArchetype)}): ${pc(rd.versusEnemy.shrunk)} over ${rd.versusEnemy.n} league games${rd.versusEnemy.mirror ? " (mirror)" : ""}${lowTag(rd.versusEnemy.low)}</p>` : ""}
        ${rd.weakAgainst && rd.weakAgainst.length ? `<p class="small muted">Styles it has struggled against: ${rd.weakAgainst.slice(0, 2).map(w => `${esc(w.arch)} ${pc(w.shrunk)} (${w.n})`).join(", ")}.</p>` : ""}</div>`;
    }
    if (theirs.length >= 2) {
      const rd = L.compRead(data, games, theirs, mine), a = rd.archetype;
      const wb = L.whatBeats(data, games, theirs, { limit: 16 });

    }

  // The deep profile (knowledge/expert/hero_profiles): what the damage is, how healing meets it, what it is good and bad into.
  function profileCard(h) {
    const hp = P.heroes[h], p = hp && hp.profile;

    const TAG = { low_sustain_healer: "low sustain healers", high_sustain_healer: "high sustain healers", single_target_healer: "single target healers", aoe_healer: "AoE healers", no_healer_sustain: "teams without healing", burst_dive: "burst and dive", poke_comp: "poke comps", sustain_comp: "sustain comps", tanky_frontline: "tanky front lines", squishy_backline: "squishy back lines", kiter: "kiters", assassin: "assassins", cc_heavy: "crowd control heavy teams", stealth: "stealth", immobile: "immobile heroes", mobile: "mobile heroes", melee_heavy: "melee heavy teams", ranged_heavy: "ranged heavy teams", summons: "summons", structures: "structures", global_ult: "global ultimates", split_push: "split pushers", objective_race: "objective races" };
    const d = p.damage || {}, a = p.attack || {}, hl = p.healing;
    const bl = d.heal_blunted;

    const into = (arr, cls) => (arr || []).map(x => `<li class="small"><span class="tag ${cls}">${esc(TAG[x.tag] || x.tag)}</span> ${esc(x.why)}</li>`).join("");
    const lens = ((P.comps || {}).heal_lens || {})[h] || {};
    const CL = { aoe_sustain: "AoE sustain healers (Brightwing, Lucio, Stukov, Auriel)", burst_single: "single target burst healers (Uther, Ana, Anduin)", sustain_single: "sustained single target healers (Malfurion, Deckard, Alexstrasza, Li Li)", other: "other healers" };
    const lensRows = Object.keys(lens).map(k => { const c = E.cell(lens[k]); return c ? `<tr><td>${esc(CL[k] || k)}</td><td class="num">${c.n}</td><td class="num">${Math.round(c.wwr * 100)}%</td><td class="num">${c.rn >= 15 ? Math.round(c.rwr * 100) + "% (" + c.rn + ")" : "n/a"}</td></tr>` : ""; }).join("");
    const own = p.owner_notes ? `<p class="small"><span class="tag us">Hunter's read</span> ${esc(p.owner_notes)}${(p.flex_roles || []).length ? " Flexes to: " + p.flex_roles.map(esc).join("; ") + "." : ""}</p>` : "";

      <p class="small">Damage is ${(d.style || []).map(esc).join(", ") || "n/a"}. Poke ${d.poke ? d.poke.rating + " of 5, " + esc(d.poke.kind) + (d.poke.dodgeable != null ? ", dodgeable " + d.poke.dodgeable + " of 5" : "") : "n/a"}. ${esc(blunted)} ${esc(d.note || "")}</p>
      ${hl ? `<p class="small"><b>Healing:</b> ${(hl.style || []).map(esc).join(", ")}. Sustain ${hl.sustain} of 5, burst heal ${hl.burst_heal} of 5, AoE ${hl.aoe} of 5. ${esc(hl.note || "")}</p>` : ""}
      <div class="cols"><div><b class="small">Good into</b><ul class="r">${into(p.good_into, "good")}</ul></div><div><b class="small">Bad into</b><ul class="r">${into(p.bad_into, "warn")}</ul></div></div>
      ${(p.wants_from_team || []).length ? `<p class="small"><b>Wants from the team:</b> ${p.wants_from_team.map(esc).join("; ")}.</p>` : ""}${(p.gives_team || []).length ? `<p class="small"><b>Gives the team:</b> ${p.gives_team.map(esc).join("; ")}.</p>` : ""}
      ${lensRows ? `<h4 style="margin-top:8px">Its side's record by the enemy healer (NGS seasons 15 to 22, one healer on their side)</h4><div class="scroll"><table><tr><th>Enemy healer</th><th>Sides</th><th>Win rate, newer seasons weighted</th><th>Newest ${(P.comps || {}).recent_seasons || 3} seasons</th></tr>${lensRows}</table></div>` : ""}
      <p class="small muted">Profile read from the ability and talent text and the league's measured numbers. Confidence ${esc(p.confidence || "n/a")}${(p.unsure || []).length ? "; unsure about: " + p.unsure.map(esc).join(", ") : ""}.</p></section>`;
  }
  function sRatings(h) {

      <div class="scroll"><table>${rows.map(k => `<tr><td>${k[1]}</td><td>${bar(r[k[0]] || 0)} <span class="num small muted">${r[k[0]] || "?"}/5</span></td></tr>`).join("")}</table></div>
      <p class="small">${ex.power_spike ? "Power spike: " + esc(ex.power_spike) + ". " : ""}${ex.pick_risk ? "Pick risk: " + esc(ex.pick_risk) + ". " : ""}${ex.skill_floor ? "Skill floor " + ex.skill_floor + " of 5, ceiling " + ex.skill_ceiling + ". " : ""}${(ex.vulnerable_to || []).length ? "Vulnerable to: " + ex.vulnerable_to.map(esc).join(", ") + "." : ""}</p>

      <div class="cols"><div><b class="small">Best maps</b><ul class="r small">${lst((d.bestMaps || []).slice(0, 4), b => `<li>${esc(b.map)} ${pc(b.shrunk)} over ${b.n}${lowTag(b.low)}</li>`)}</ul></div>

  function leagueMapCard(cur) {

      <p class="small muted">${o.h2h.length} games between us and ${esc(ui.opp)} this season (we won ${ourWins}). Records are from our side for our heroes and from their side for theirs. Tiny samples, read as leans.</p>
      <div class="cols"><div><b class="small">Their heroes against us (their record)</b><ul class="r">${theirs.map(h => line(h, o.hero_picks_vs_us[h], "")).join("") || "<li class='muted small'>none</li>"}</ul></div>
      <div><b class="small">Our heroes against them (our record)</b><ul class="r">${ours.map(h => line(h, o.our_heroes_vs_them[h], poolOf(h).length ? poolOf(h).map(x => esc(x.label)).join(", ") : "")).join("") || "<li class='muted small'>none</li>"}</ul></div></div></section>`;
  }

  // Last season, under the same name and under names the roster suggests this team used before (turn each off if it is wrong).
  function formerNames(team) {
    return ((LG && LG.aliases) || []).filter(a => a.team === team && a.confidence !== "low" && !ui.aliasOff[a.team + "|" + a.former]);
  }
  function lastSeasonCard(team) {
    if (!LG || !LG.history) return "";
    const names = [team].concat(formerNames(team).map(a => a.former)).filter(n => LG.history[n]);
    const cands = ((LG.aliases) || []).filter(a => a.team === team);
    if (!names.length && !cands.length) return "";
    const rows = names.map(n => {
      const h = LG.history[n], a = cands.find(x => x.former === n);
      return `<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px"><b>${esc(n)}</b>${a ? ` <span class="tag warn">probably the same team: ${a.shared} of ${a.core_now} players</span>` : ""}
        <p class="small">Season 21: ${h.wins}-${h.games - h.wins}${h.playoffs && h.playoffs[0] ? ` (playoffs ${h.playoffs[1]}-${h.playoffs[0] - h.playoffs[1]})` : ""}. First pick ${h.first_pick[1]}-${h.first_pick[0] - h.first_pick[1]}.</p>
        <p class="small">Picked most: ${h.picks.slice(0, 6).map(p => `${heroBtn(p[0])} ${p[2]}-${p[1] - p[2]}`).join(", ") || "none"}</p>
        <p class="small">Banned most: ${h.bans.slice(0, 5).map(b => `${heroBtn(b[0])} ${b[1]}`).join(", ") || "none"}</p></div>`;
    }).join("");
    const toggles = cands.map(a => `<label class="small" style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" data-alias="${esc(a.team + "|" + a.former)}" ${ui.aliasOff[a.team + "|" + a.former] ? "" : "checked"}> Treat ${esc(a.former)} as an earlier name (${a.shared} players in common, ${esc(a.confidence)} confidence${a.note ? ", " + esc(a.note) : ""})</label>`).join("");
    return `<section class="card them"><h3>Last season</h3><p class="small muted">Season 21 record and habits from last season's games. Name changes are not published, so earlier names are guessed from which players are on the roster. Untick one that is wrong.</p>${rows}${toggles}</section>`;
  }

  // Average Storm League MMR of a roster's five most used players, when at least three of them have one.
  function teamMmr(players) {
    const list = players.slice().sort((a, b) => (b.games || 0) - (a.games || 0)).slice(0, 5).map(p => p.sl_mmr && p.sl_mmr[0]).filter(Boolean);
    return list.length >= 3 ? Math.round(list.reduce((a, b) => a + b, 0) / list.length) : null;
  }

  function renderOverview() {
    const o = P.teams[ui.opp], t = E.tossAdvice(ui.opp), mp = E.mapPlan(ui.opp), st = E.newDraft(ui.opp, "first", ui.map);
    const ex = E.expectOppBans(st);
    const rules = E.rulesFor({ opp: ui.opp, side: "first", map: ui.map });
    const players = Object.keys(o.players).sort((a, b) => o.players[b].games - o.players[a].games).filter(tag => o.players[tag].games >= 3);
    const lock = [];
    P.us.players.forEach(p => Object.keys(p.pool).forEach(h => { const n = (o.bans_r2[h] || 0); if (n >= 2) lock.push(`${h} (${p.label}): banned in round two ${n} time(s)${o.bans_r2_vs_us && o.bans_r2_vs_us[h] ? ", " + o.bans_r2_vs_us[h] + " against us" : ""}`); }));
    return `<section class="card"><label class="f">Opponent<select id="opp">${oppOptions()}</select></label>
      <p><b>${esc(ui.opp)}</b> is ${o.wins}-${o.games - o.wins} this season. First pick ${recText(o.first_pick)}, map pick ${recText(o.map_pick)}.
      ${o.h2h.length ? "Against us (our result): " + o.h2h.map(g => `${esc(g.map)} ${g.won ? "L" : "W"}`).join(", ") + "." : "No games against us yet."}
      ${(() => { const them = teamMmr(Object.keys(o.players).map(t => ({ games: o.players[t].games, sl_mmr: o.players[t].sl_mmr }))); const us = teamMmr(P.us.players.map(p => ({ games: Object.keys(p.ngs || {}).reduce((x, h) => x + p.ngs[h].g, 0), sl_mmr: p.sl_mmr }))); return them && us ? `<br><span class="small muted">Average Storm League MMR of the five most used players: ${esc(ui.opp)} ${them}, ${esc(P.us.team)} ${us}.</span>` : ""; })()}</p></section>
    <section class="card us"><h3>Coin toss</h3><p>If we win it: <b>${t.pick === "first" ? "first pick" : t.pick === "map" ? "map pick" : "either (toss up)"}</b>.
      Our record with first pick ${rec(t.usFirst)}, with map pick ${rec(t.usMap)}; theirs ${rec(t.themFirst)} and ${rec(t.themMap)}. First pick lets us decide who takes the contested heroes; the map pick lets us choose where.</p></section>
    <section class="card"><h3>Maps</h3>
      <p class="small muted">Suggested map bans: <b>${mp.bans.map(esc).join(" and ") || "none yet"}</b>. If we get the map pick: ${mp.picks.map(esc).join(", ")}. Records are this season in this division, so most are 1 to 4 games. "Us v them" is our record in games against ${esc(ui.opp)} only (blank if we have not played them there).</p>

      ${mp.table.sort((a, b) => b.banScore - a.banScore).map(m => `<tr><td><button class="hl" data-gomap="${esc(m.map)}">${esc(m.map)}</button></td><td class="num">${recText(m.us)}</td><td class="num">${recText(m.them)}</td><td class="num">${m.vsUs[0] ? recText(m.vsUs) : ""}</td><td class="num">${recText(m.themPicker)}</td><td class="num">${m.theyBan}</td>
        <td>${mp.bans.includes(m.map) ? '<span class="tag bad">ban</span>' : mp.picks.includes(m.map) ? '<span class="tag good">pick</span>' : ""}</td></tr>`).join("")}</table></div></section>
    <section class="card them"><h3>What they ban</h3>
      <p class="small">Round one: ${ex.round1.slice(0, 6).map(x => `${heroBtn(x.hero)} ${x.n}${x.vs ? " (" + x.vs + " vs us)" : ""}`).join(", ") || "none"}</p>
      <p class="small">Round two (slot 10 or 11): ${ex.round2.slice(0, 6).map(x => `${heroBtn(x.hero)} ${x.n}${x.vs ? " (" + x.vs + " vs us)" : ""}`).join(", ") || "none"}</p>
      ${lock.length ? `<p class="small"><b>Heroes of ours they ban late, so lock them early:</b></p><ul class="r small">${lock.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</section>
    ${vsUsCard(o)}
    ${lastSeasonCard(ui.opp)}
    ${answersCard()}
    <section class="card them"><h3>Their players</h3><div class="scroll"><table><tr><th>Player</th><th>Heroes this season</th></tr>
      ${players.map(tag => `<tr><td>${esc(tag)}<div class="muted small">${(() => { const r = roleSummary(o.players[tag].heroes); return `${r.g} games ${wrTxt(r.w, r.g)} · ${esc(r.main)}${r.off ? " / " + esc(r.off) : ""}`; })()}</div><div class="muted small">rating ${o.players[tag].avg_rating}${o.players[tag].sl_mmr ? ` · SL MMR ${o.players[tag].sl_mmr[0]}${o.players[tag].sl_mmr[1] ? " " + esc(o.players[tag].sl_mmr[1]) : ""}` : ""}</div></td><td class="small">${Object.keys(o.players[tag].heroes).slice(0, 6).map(h => { const d = o.players[tag].heroes[h]; return `${heroBtn(h)} ${wrTxt(d.w, d.g)}${d.weak ? ' <span class="tag warn">weaker</span>' : ""}`; }).join(", ")}</td></tr>`).join("")}</table></div>
      <p class="small muted">"Weaker" means the player rates clearly lower on that hero than on his others, so banning it may do nothing.</p></section>
    <section class="card"><h3>Rules in play</h3><ul class="r small">${rules.map(r => `<li><b>${esc(r.id)}:</b> ${esc(r.text || r.why)} <span class="muted">(${esc(r.evidence || "")})</span></li>`).join("")}</ul></section>
    ${o.notes ? `<section class="card note"><h3>Notes on ${esc(ui.opp)}</h3>${md(o.notes)}</section>` : ""}`;

  // ---------------------------------------------------------------- HEROES TAB
  function heroRowHtml(h) {

      <span class="meta">${d && d.hp && (d.hp.deep || d.hp.now) ? `<span class="small muted" title="Heroes Profile Storm League win rate, ${d.hp.deep ? "the newest patches together with the last 2.55 patch" : "newest patch"}">HP ${(d.hp.deep || d.hp.now).win}%</span>` : ""}${div && div.g ? `<span class="small muted">${div.g}g ${div.w}w</span>` : ""}${div && div.bans ? `<span class="small muted">${div.bans} bans</span>` : ""}${t ? `${tierTag(t)}<span class="small muted">${esc(t.role)}</span>` : ""}</span></button>`;
  }
  const hpv = (h, k) => { const x = lh(h) && lh(h).hp ? (lh(h).hp.deep || lh(h).hp.now) : null; return x ? x[k] : 0; };
  function heroListHtml() {
    const q = keyOf(ui.hq);
    let names = Object.keys(P.heroes).sort().filter(h => (!q || keyOf(h).includes(q) || keyOf(roleOf(h)).includes(q)) && (ui.hrole === "All" || roleOf(h) === ui.hrole) && (!ui.hpool || poolOf(h).length));
    if (ui.hsort === "tier") names.sort((a, b) => { const ta = mainTier(a, ui.hscope), tb = mainTier(b, ui.hscope); return (ta ? rk(ta.tier) : 9) - (tb ? rk(tb.tier) : 9) || a.localeCompare(b); });
    else if (ui.hsort === "picked") names.sort((a, b) => ((lh(b) && lh(b).division ? lh(b).division.g : 0) - (lh(a) && lh(a).division ? lh(a).division.g : 0)) || a.localeCompare(b));
    else if (ui.hsort === "hpwin") names.sort((a, b) => (hpv(b, "win") - hpv(a, "win")) || a.localeCompare(b));
    else if (ui.hsort === "hpban") names.sort((a, b) => (hpv(b, "ban") - hpv(a, "ban")) || a.localeCompare(b));
    else if (ui.hsort === "banned") names.sort((a, b) => ((lh(b) && lh(b).division ? lh(b).division.bans : 0) - (lh(a) && lh(a).division ? lh(a).division.bans : 0)) || a.localeCompare(b));
    return `<p class="small muted">${names.length} heroes</p><div class="hlist">${names.map(heroRowHtml).join("") || '<p class="muted">No heroes match.</p>'}</div>`;
  }
  function renderHeroes() {
    const scopes = [["general", "Icy general tier list"], ["master", "Icy master tier list (Diamond and up)"], ["fan", "Fan HotS tier list (from the image)"]].concat(Object.keys(P.maps).sort().map(m => [m, "Icy tier list on " + m]));
    return `<section class="card"><div class="row">
        <label class="f grow">Search<input type="search" id="hq" value="${esc(ui.hq)}" placeholder="Hero or role" autocomplete="off"></label>
        <label class="f grow">Sort<select id="hsort">${[["name", "Name"], ["tier", "Tier"], ["picked", "Most picked here"], ["banned", "Most banned here"], ["hpwin", "Heroes Profile win rate"], ["hpban", "Heroes Profile ban rate"]].map(s => `<option value="${s[0]}" ${s[0] === ui.hsort ? "selected" : ""}>${s[1]}</option>`).join("")}</select></label></div>
      <div class="chips" style="margin-top:10px">${["All"].concat(ROLES).map(r => `<button class="chip ${ui.hrole === r ? "on" : ""}" data-hrole="${esc(r)}" aria-pressed="${ui.hrole === r}">${esc(r)}</button>`).join("")}

      <details style="margin-top:8px"><summary>Tier list and how to read this</summary>
        <label class="f" style="margin-top:6px">Tier list shown<select id="hscope">${scopes.map(s => `<option value="${esc(s[0])}" ${s[0] === ui.hscope ? "selected" : ""}>${esc(s[1])}</option>`).join("")}</select></label>
        <p class="small muted">Tier is the Icy Veins tier for the hero's main role. Tap a hero for the overview, builds, talents, abilities, matchups, maps and who on our team plays it. "g" and "w" are games and wins in this division, "bans" is how often it was banned in ${P.meta.games} games. "HP" is the Heroes Profile Storm League win rate over the newest 2.57 patches plus the last 2.55 patch${LIB.hp_meta && LIB.hp_meta.deep ? " (as of " + esc(LIB.hp_meta.deep.asof) + ")" : ""}.</p></details></section>
      <div id="hlist">${heroListHtml()}</div>`;
  }

  // ---------------------------------------------------------------- HERO SHEET
  let sheet = { stack: [], tab: "overview" };
  const STABS = [["overview", "Overview"], ["ratings", "Ratings"], ["builds", "Builds"], ["talents", "Talents"], ["abilities", "Abilities"], ["matchups", "Matchups"], ["maps", "Maps"], ["team", "Team"]];
  const noLib = () => `<p class="warnbox">The Icy Veins library has no page for this hero.</p>`;
  function heroTags(h) {
    const g = mainTier(h, "general"), m = mainTier(h, "master"), mp = ui.map ? mainTier(h, ui.map) : null;
    return `<span class="tag">${esc(roleOf(h))}</span> ${g ? `<span class="small">General ${tierTag(g)}</span>` : ""} ${m ? `<span class="small">Master ${tierTag(m)}</span>` : ""} ${(lh(h) && lh(h).fan || []).map(f => `<span class="small" title="Fan HotS tier list${f.check ? ", weak match to confirm" : ""}">Fan ${esc(f.role)} ${tierTag(f)}${f.check ? "?" : ""}</span>`).join(" ")} ${mp ? `<span class="small">${esc(ui.map)} ${tierTag(mp)}</span>` : ""}
      ${poolOf(h).map(x => `<span class="tag us">${esc(x.label)} ${esc(x.tier)}</span>`).join(" ")}`;
  }
  function sOverview(h) {
    const d = lh(h); if (!d) return noLib();
    const div = d.division;
    const bits = [];
    if (div) bits.push(`In this division: picked ${div.g} time${div.g === 1 ? "" : "s"}${div.g ? ` (${div.w} win${div.w === 1 ? "" : "s"})` : ""}, banned in ${div.bans} of ${div.games} games.`);

    return `${bits.length ? `<p class="small">${esc(bits.join(" "))}</p>` : ""}${hpLine}
      <div class="prose">${paras(d.overview)}</div>
      <div class="cols"><div><h3>Strengths</h3><ul>${(d.strengths || []).map(x => `<li>${esc(x)}</li>`).join("") || "<li>none listed</li>"}</ul></div><div><h3>Weaknesses</h3><ul>${(d.weaknesses || []).map(x => `<li>${esc(x)}</li>`).join("") || "<li>none listed</li>"}</ul></div></div>
      ${d.meta_text ? `<div class="prose"><h3>Role in the current meta</h3>${paras(d.meta_text)}</div>` : ""}
      ${d.tips ? `<details class="sec"><summary>Tips and tricks</summary><div class="prose">${paras(d.tips)}</div></details>` : ""}
      <p class="small muted">Icy Veins pages for ${esc(h)}: guide updated ${esc(prettyDate(d.updated.guide))}, talents updated ${esc(prettyDate(d.updated.talents))}.</p>`;
  }
  function flagText(c, d) {
    const out = [];
    if (c.flags.includes("old")) out.push(c.before ? "Icy lists this build as before June 2020." : "This build is more than a year old.");
    if (c.flags.includes("patched")) out.push(`The Icy talent page changed on ${prettyDate(d.updated.talents)}, after this code was made. Check each pick in game.`);
    return out;
  }
  const mk = m => m === "yes" ? '<span class="mk y" title="Icy marker: tick">✓</span>' : m === "no" ? '<span class="mk n" title="Icy marker: cross">✗</span>' : '<span class="mk m" title="Icy marker: question mark">?</span>';
  function sBuilds(h) {
    const d = lh(h); if (!d) return noLib();
    const codes = d.codes || [];
    const cards = codes.map(c => {
      const ft = flagText(c, d);
      return `<div class="card" style="padding:10px"><div class="row" style="justify-content:space-between"><b>${esc(c.label)}</b><span class="small muted">Icy build updated ${c.before ? "before " : ""}${esc(prettyDate(c.date))}</span></div>
        ${ft.map(x => `<div class="warnbox small" style="margin-top:6px">${esc(x)}</div>`).join("")}
        <div class="row" style="margin-top:8px"><code class="code">${esc(c.code)}</code><button class="btn sm" data-copy="${esc(c.code)}">Copy code</button></div>
        <table style="margin-top:6px"><tr><th>Level</th><th>Talent</th></tr>${c.picks.map(p => `<tr><td class="num">${p.level}</td><td>${mk(p.mark)} ${esc(p.name)}</td></tr>`).join("")}</table></div>`;
    }).join("");
    const notes = (d.build_notes || []).map(b => `<details class="sec"><summary>${esc(b.name)} <span class="tag">${esc(b.tag)}</span></summary><div class="prose">${paras(b.text)}</div></details>`).join("");
    return `<p class="small muted">Codes are the in game import codes from your Icy Veins sheet. Each pick is looked up in the Icy talent table for ${esc(h)}. The marks are the Icy Veins markers on that table: ✓ tick, ? question mark, ✗ cross. To use a code, copy it and paste it in the in game talent calculator (the import box).</p>
      ${cards || `<p class="warnbox">No build code for ${esc(h)} in the sheet. The Icy notes below still describe the builds.</p>`}
      ${notes ? `<h3>Icy Veins build notes</h3><p class="small muted">The talent icons are not in our copy of the guide, so these notes do not list the picks. Open the Talents tab to read every option.</p>${notes}` : ""}`;
  }
  function sTalents(h) {
    const d = lh(h); if (!d) return noLib();

  }
  function sAbilities(h) {

  function sTeam(h) {
    const out = [];
    P.us.players.forEach(p => {
      const ng = p.ngs && p.ngs[h], sl = p.sl && p.sl.heroes && p.sl.heroes[h], note = p.notes && p.notes[h], avoid = (p.avoid || []).includes(h);
      if (!p.pool[h] && !ng && !avoid && !(sl && sl[0] >= 3)) return;
      out.push(`<tr><td><b>${esc(p.label)}</b></td><td>${p.pool[h] ? `<span class="tag us">${esc(p.pool[h])}</span>` : avoid ? '<span class="tag warn">avoid</span>' : '<span class="small muted">not in pool</span>'}</td><td class="num">${ng ? wrTxt(ng.w, ng.g) : ""}</td><td class="num">${sl && sl[0] ? wrTxt(sl[1], sl[0]) : ""}</td></tr>${note ? `<tr><td colspan="4" class="small muted">${esc(note)}</td></tr>` : ""}`);
    });
    const theirs = [];
    Object.keys(P.teams).filter(t => t !== P.us.team).forEach(t => Object.keys(P.teams[t].players).forEach(tag => { const r = P.teams[t].players[tag].heroes[h]; if (r) theirs.push(`${esc(tag)} (${esc(t)}) ${r.w}-${r.g - r.w}${r.weak ? " weaker" : ""}`); }));
    return `<h3>Our team</h3>${out.length ? `<div class="scroll"><table><tr><th>Player</th><th>Pool</th><th>NGS S${P.meta.season}</th><th>Storm League</th></tr>${out.join("")}</table></div>
      <p class="small muted">Storm League covers the games on file for the players that have them (Hunter, the last 12 months). Small samples, read them as leans.</p>` : '<p class="muted">Nobody on our team has this hero in a pool or a record this season.</p>'}
      <h3>Who plays it in this division</h3>${theirs.length ? `<p class="small">${theirs.join("; ")}</p>` : '<p class="muted small">Nobody on the other teams has a game on it this season.</p>'}`;
  }
  const SBODY = { overview: sOverview, ratings: sRatings, builds: sBuilds, talents: sTalents, abilities: sAbilities, matchups: sMatchups, maps: sMaps, team: sTeam };
  function renderSheet() {
    const h = sheet.stack[sheet.stack.length - 1]; if (!h) return;
    $("#sheet").innerHTML = `<div class="sheet-head"><div class="row" style="justify-content:space-between;flex-wrap:nowrap">
        <div class="row" style="flex-wrap:nowrap">${sheet.stack.length > 1 ? '<button class="btn sm" data-back="1" aria-label="Back to the previous hero">Back</button>' : ""}<h2 id="sheet-title">${esc(h)}</h2></div>
        <button class="btn sm" data-close="sheet">Close</button></div>
      <div class="row" style="margin-top:6px">${heroTags(h)}</div>
      <div class="tabs small" role="tablist" id="stabs">${STABS.filter(t => t[0] !== "ratings" || lab()).map(t => `<button class="tab" role="tab" data-stab="${t[0]}" aria-selected="${sheet.tab === t[0]}">${t[1]}</button>`).join("")}</div></div>
      <div class="sheet-body" id="sbody">${SBODY[sheet.tab](h)}</div>`;
  }
  function openHero(h, tab) {
    if (!P.heroes[h]) return;
    const d = $("#sheet");
    if (!d.open) sheet.stack = [];   // a closed sheet starts a fresh trail (Esc closes it without our code running)
    if (sheet.stack[sheet.stack.length - 1] !== h) sheet.stack.push(h);
    sheet.tab = tab || "overview";
    renderSheet();
    if (!d.open) { if (d.showModal) d.showModal(); else d.setAttribute("open", ""); }
    const b = $("#sbody"); if (b) b.scrollTop = 0;
  }
  function closeDialog(id) { const d = $("#" + id); if (d.open) { if (d.close) d.close(); else d.removeAttribute("open"); } if (id === "sheet") sheet.stack = []; }

      ${ngs ? `${ui.map !== cur ? `<p><button class="btn sm" data-setmap="${esc(cur)}">Use ${esc(cur)} as the draft map</button></p>` : `<p class="small"><span class="tag us">draft map</span></p>`}<p><b>Icy Veins prefers:</b> ${m.prefer.map(esc).join(", ") || "n/a"}</p><p><b>Avoids:</b> ${m.avoid.map(esc).join(", ") || "n/a"}</p>
      <p class="small">We are ${recText(P.teams[P.us.team].by_map[cur])} here; ${esc(ui.opp)} are ${recText(oppRec)}.${(() => { const g = (P.teams[ui.opp].h2h || []).filter(x => x.map === cur); return g.length ? ` Against each other here we are ${g.filter(x => !x.won).length}-${g.filter(x => x.won).length}.` : ""; })()} ${st.games || 0} games in the division, average ${st.avg_len || "?"} minutes.</p>` : `<p class="small muted">This map is not in the NGS pool this season, so there are no division numbers for it. The Icy Veins guide is below.</p>`}</section>
    ${st.games ? `<section class="card"><h3>What wins here</h3>
      <p class="small">Ranged heroes: winners average ${st.win_ranged_avg}, losers ${st.loss_ranged_avg}. Three or more ranged ${rec(st.ranged_rec["3+"])}, two or fewer ${rec(st.ranged_rec["2-"])}.</p>
      <p class="small">Per minute, winners against losers: camp damage ${st.macro.win.camp_dmg}k v ${st.macro.loss.camp_dmg}k, structure damage ${st.macro.win.struct}k v ${st.macro.loss.struct}k, minion damage ${st.macro.win.minion}k v ${st.macro.loss.minion}k. Deaths ${st.macro.win.deaths} v ${st.macro.loss.deaths}.</p></section>` : ""}
    ${leagueMapCard(cur)}

      ${rows.map(r => { const p = P.us.players.find(x => x.label === r.p); const g = mine[p.tag] && mine[p.tag][r.h]; return `<tr><td>${heroBtn(r.h)} <span class="muted small">${esc(r.pool)}</span></td><td>${esc(r.p)}</td><td><span class="tag ${"SA".includes(r.tier) ? "good" : "DC".includes(r.tier) ? "warn" : ""}">${r.tier} ${esc(r.role)}</span></td><td class="num">${g ? rec(g) : ""}</td></tr>`; }).join("")}</table></div></section>` : ""}
    ${Object.keys(top).length ? `<section class="card"><h3>Icy Veins top tiers here</h3><p class="small muted">S and A tier heroes on the ${esc(cur)} tier list, by role. Outlined heroes are in our pools.</p>
      ${Object.keys(top).sort().map(role => `<p class="small" style="margin-bottom:2px"><b>${esc(role)}</b></p><div class="chips" style="margin-bottom:8px">${top[role].S.sort().map(h => chip(h, null, "S")).join("")}${top[role].A.sort().map(h => chip(h, null, "A")).join("")}</div>`).join("")}</section>` : ""}

    ${lib && lib.sections.length ? `<section class="card"><h3>Icy Veins map guide</h3><p class="small muted">The objective, camps, lane formations and win conditions. Dates and numbers are as Icy Veins states them.</p>

  }
