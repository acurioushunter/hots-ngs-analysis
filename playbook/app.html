      <ul><li>Hero, map and guide text, talents and tier lists are saved Icy Veins pages. Hero guides range from ${esc(prettyDate(g[0]))} to ${esc(prettyDate(g[g.length - 1]))}, talent pages from ${esc(prettyDate(t[0]))} to ${esc(prettyDate(t[t.length - 1]))}. Library built ${esc(prettyDate(LIB.built))}.</li>
      <li>${LIB.build_codes} build codes come from a shared Icy Veins sheet. ${codes.filter(c => c.flags.includes("old")).length} are more than a year old and ${codes.filter(c => c.flags.includes("patched")).length} have a talent page that changed after the code was made. Those carry a flag.</li>
      <li>Records, drafts and stats come from the NGS match pages on Heroes Profile. Every suggestion shows its reasons and the record behind it. Most records are 1 to 12 games, so treat them as leans.</li>
      ${LIB.hp_meta ? `<li>Heroes Profile Storm League hero stats, saved from the global hero page: ${["now", "deep"].filter(k => LIB.hp_meta[k]).map(k => `${LIB.hp_meta[k].heroes} heroes for ${esc(LIB.hp_meta[k].patches.join(", "))} (as of ${esc(LIB.hp_meta[k].asof)})`).join(" and ")}. These are global numbers across all players, not NGS.</li>` : ""}
      ${LG && LG.mmr_players ? `<li>Storm League MMR for ${LG.mmr_players} NGS players comes from their Heroes Profile profiles (Storm League only).</li>` : ""}
      <li>Judgment calls (who to ban, which healer, ranged limits per map) are in <code>rules.json</code> with the evidence, and hand tuned pools are in <code>our_team.json</code>. Rules written about one team only apply to that team.</li>
      <li>NGS pages have no timeline, so nothing here knows who led at ten minutes.</li>
      <li>The draft you are working on, your team and your pool are kept on this device only.</li></ul>
      <h3>How complete is a team's data?</h3>
      <p class="small">A team that has played 6 or more games this season has real pools and ban habits. A team with 2 or 3 games shows what little there is. The tool was first tuned for one team, which has hand written pools, Storm League history and notes. Every other team gets pools worked out from its NGS games. Adding a player's own heroes in the Team tab is the quickest way to improve that.</p>
      <p>To refresh: pull the new games, run <code>python build_ngs_season.py</code> and <code>python build_playbook.py</code>, then publish the new file over the same link. See UPDATE_PLAYBOOK.md.</p></section>`;
  }

  // ---------------------------------------------------------------- wiring
  function render() {
    renderTabs();
    const v = ui.tab === "draft" ? renderDraft() : ui.tab === "overview" ? renderOverview() : ui.tab === "heroes" ? renderHeroes() : ui.tab === "maps" ? renderMaps() : ui.tab === "learn" ? renderLearn() : ui.tab === "team" ? renderTeam() : renderAbout();
    const keep = window.scrollY;
    $("#view").innerHTML = v;
    if (ui._keepScroll) { window.scrollTo(0, keep); ui._keepScroll = false; }
    if (window.hotsPost) window.hotsPost({ type: "tab", tab: ui.tab });
  }
  function record(hero, st) {
    const key = heroKey[keyOf(hero)];
    if (hero === "No Pick") { E.apply(st, "No Pick"); return true; }
    if (!key) { ui.msg = `"${hero}" is not a hero in the list. Check the spelling.`; return false; }
    if (E.used(st).has(key)) { ui.msg = `${key} is already banned or picked.`; return false; }
    E.apply(st, key); ui.msg = ""; return true;
  }
  function flash(btn, text) { const old = btn.textContent; btn.textContent = text; setTimeout(() => { btn.textContent = old; }, 1600); }
  function copyText(text, btn) {
    const fallback = () => {
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta); flash(btn, ok ? "Copied" : "Select and copy by hand: " + text.slice(0, 40));
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => flash(btn, "Copied"), fallback); else fallback();
  }
  document.addEventListener("click", ev => {
    const dlg = ev.target;
    if (dlg && dlg.tagName === "DIALOG") { closeDialog(dlg.id); return; }  // click on the backdrop
    const b = ev.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    if (d.copy) { copyText(d.copy, b); return; }
    if (d.copySummary) { copyText(summaryText(state()), b); return; }
    if (d.close) { closeDialog(d.close); return; }
    if (d.back) { sheet.stack.pop(); sheet.tab = "overview"; renderSheet(); return; }
    if (d.stab) { sheet.tab = d.stab; renderSheet(); const sb = $("#sbody"); if (sb) sb.scrollTop = 0; return; }
    if (d.take && ev.target.closest("#picker")) { const st = state(); if (record(d.take, st)) { ui.actions = st.actions; ui.sim = null; closeDialog("picker"); closeDialog("sheet"); save(); render(); } return; }
    if (d.hero && !d.take) { openHero(d.hero, d.htab); return; }
    if (d.prole) { ui.prole = d.prole; openPicker(); return; }
    if (d.gomap) { ui.mapview = d.gomap; ui.tab = "maps"; closeDialog("sheet"); window.scrollTo(0, 0); }
    else if (d.setmap) { ui.map = d.setmap; ui.sim = null; }
    else if (d.hrole) { ui.hrole = d.hrole; ui._keepScroll = true; }
    else if (d.hpool) { ui.hpool = !ui.hpool; ui._keepScroll = true; }
    else if (d.ltab) { ui.ltab = d.ltab; }
    else if (d.tab) { ui.tab = d.tab; window.scrollTo(0, 0); }
    else if (d.side) { if (ui.side !== d.side) { ui.actions = []; ui.sim = null; } ui.side = d.side; }
    else if (d.take) { const st = state(); if (record(d.take, st)) { ui.actions = st.actions; ui.sim = null; } }
    else if (d.act === "free") { const v = ($("#free") || {}).value || ""; const st = state(); if (v && record(v, st)) { ui.actions = st.actions; ui.sim = null; } else if (!v) ui.msg = "Type a hero first."; }
    else if (d.ngs) {
      const k = d.ngs, i = ui.ngsSeasons.indexOf(k);
      if (i >= 0) { if (ui.ngsSeasons.length > 1) ui.ngsSeasons.splice(i, 1); } else ui.ngsSeasons.push(k);
      ui.ngsSeasons.sort().reverse(); applyTeam();
    }
    else if (d.series) {
      const st = state();
      if (d.series === "clear") { ui.series = []; ui.actions = []; ui.sim = null; }
      else if (d.series === "undo") { ui.series.pop(); ui.sim = null; }
      else {
        ui.series.push({ map: ui.map, mapBans: JSON.parse(JSON.stringify(ui.mapBans)), won: d.series === "won", ours: E.picks(st, "us"), theirs: E.picks(st, "opp"), bans: { ours: E.bans(st, "us"), theirs: E.bans(st, "opp") } });
        ui.actions = []; ui.sim = null; ui.side = null; ui.map = null; ui.mapBans = { us: ["", ""], opp: ["", ""] };   // who has first pick next depends on the series rules, so it is asked again
      }
    }
    else if (d.stage) {
      const k = d.stage, i = ui.stages.indexOf(k);
      if (i >= 0) { if (ui.stages.length > 1) ui.stages.splice(i, 1); } else ui.stages.push(k);
      applyTeam();
    }
    else if (d.sl) {
      const k = d.sl, i = ui.slScopes.indexOf(k);
      if (i >= 0) ui.slScopes.splice(i, 1); else ui.slScopes.push(k);
      applyTeam();
    }
    else if (d.poolrm) { ui.mypool = ui.mypool || {}; ui.mypool[d.poolrm] = "none"; applyTeam(); }
    else if (d.poolset) {
      const v = (($("#poolhero") || {}).value || "").trim(), key = heroKey[keyOf(v)], tier = ($("#pooltier") || {}).value || "primary";
      if (!key) ui.msg = v ? `"${v}" is not a hero in the list.` : "Type a hero first.";
      else { ui.mypool = ui.mypool || {}; ui.mypool[key] = tier; ui.msg = ""; applyTeam(); }
    }
    else if (d.act === "wipe") { try { localStorage.removeItem(SAVE); } catch (e) { /* ignore */ } location.reload(); return; }
    else if (d.act === "browse") { openPicker(); return; }
    else if (d.act === "undo") { ui.actions.pop(); ui.sim = null; ui.msg = ""; }
    else if (d.act === "reset") { ui.actions = []; ui.sim = null; ui.msg = ""; }
    else if (d.act === "more") { ui.showAll = !ui.showAll; }
    else if (d.act === "sim") { ui.sim = ui.sim ? null : E.simulate(state()); }
    else return;
    save(); render();
  });
  document.addEventListener("change", ev => {
    const t = ev.target;
    if (t.id === "teamsel") { ui.team = t.value; ui.teamPicked = true; ui.me = null; ui.mypool = {}; ui.opp = null; ui.actions = []; ui.series = []; ui.side = null; ui.map = null; ui.mapBans = { us: ["", ""], opp: ["", ""] }; ui.sim = null; ui.msg = ""; applyTeam(); }
    else if (t.dataset && t.dataset.alias) { ui.aliasOff[t.dataset.alias] = !t.checked; }
    else if (t.id === "mesel") { ui.me = t.value || null; ui.mypool = {}; ui.teamPicked = true; ui.msg = ""; applyTeam(); }
    else if (t.id === "opp") { ui.opp = t.value; ui.actions = []; ui.sim = null; ui.series = []; ui.mapBans = { us: ["", ""], opp: ["", ""] }; }
    else if (t.dataset && t.dataset.mapban) { const k = t.dataset.mapban.split(":"); ui.mapBans[k[0]][+k[1]] = t.value; if (ui.map && allMapBans().includes(ui.map)) ui.map = null; ui.sim = null; }
    else if (t.id === "map") { ui.map = t.value || null; ui.sim = null; }
    else if (t.id === "mapview") { ui.mapview = t.value; }
    else if (t.id === "hscope") { ui.hscope = t.value; }
    else if (t.id === "hsort") { ui.hsort = t.value; }
    else return;
    save(); render();
  });
  document.addEventListener("input", ev => {
    const t = ev.target;
    if (t.id === "hq") { ui.hq = t.value; $("#hlist").innerHTML = heroListHtml(); }
    else if (t.id === "gq") { ui.gq = t.value; $("#glist").innerHTML = glossaryHtml(); }
    else if (t.id === "pq") { ui.pq = t.value; $("#plist").innerHTML = pickerListHtml(); }
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "free") { const b = document.querySelector('[data-act="free"]'); if (b) b.click(); } });
  // HotS Tools: when embedded, the shell drives the tab and can open a hero sheet.
  if (window.HOTS_EMBED) {
    window.addEventListener("message", ev => {
      const d = ev.data; if (!d || !d.hots) return;
      if (d.type === "goto" && TABS.some(t => t[0] === d.tab)) { closeDialog("sheet"); closeDialog("picker"); ui.tab = d.tab; render(); window.scrollTo(0, 0); }
      else if (d.type === "hero" && P.heroes[d.hero]) { openHero(d.hero); }
    });
  }
  load();
  if (window.HOTS_EMBED && window.HOTS_TAB && TABS.some(t => t[0] === window.HOTS_TAB)) ui.tab = window.HOTS_TAB;
  render();
})();
</script>
