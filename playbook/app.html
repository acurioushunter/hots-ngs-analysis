<title>PRA Draft Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a one-hand phone tool. Top tabs, a 16 slot board, one decision card at a time. Amethyst is us, burnt orange is them. Hero sheets slide up over any tab. */
:root {
  --bg: #F4F3F8; --surface: #FFFFFF; --surface2: #ECEAF3; --line: #D9D5E6; --ink: #1B1830; --muted: #5E5875;
  --us: #5B34A0; --us-soft: #E9E1F7; --them: #A84A12; --them-soft: #F7E6DA;
  --good: #1B6E46; --good-soft: #DDF1E6; --warn: #8F6200; --warn-soft: #F8EBC8; --bad: #B3261E; --bad-soft: #F9DEDB; --focus: #2F6FEB;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13101D; --surface: #1C1830; --surface2: #262140; --line: #38325C; --ink: #ECE9F7; --muted: #A59FBD;
    --us: #B99BF2; --us-soft: #2E2350; --them: #F0A06B; --them-soft: #3A2619;
    --good: #5FD39A; --good-soft: #17352A; --warn: #E3B44F; --warn-soft: #3B2F10; --bad: #FF8A80; --bad-soft: #3F1D1B; --focus: #7FA8FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13101D; --surface: #1C1830; --surface2: #262140; --line: #38325C; --ink: #ECE9F7; --muted: #A59FBD;
  --us: #B99BF2; --us-soft: #2E2350; --them: #F0A06B; --them-soft: #3A2619;
  --good: #5FD39A; --good-soft: #17352A; --warn: #E3B44F; --warn-soft: #3B2F10; --bad: #FF8A80; --bad-soft: #3F1D1B; --focus: #7FA8FF; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 0 40px; }
* { box-sizing: border-box; }
.wrap { max-width: 760px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: 0.01em; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
p { margin: 0.4em 0; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 8px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.brand h1 { font-size: 1.6rem; }
.brand small { color: var(--muted); font-size: 0.78rem; }
.tabs { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--us); color: var(--bg); border-color: var(--us); }
.tabs.small .tab { padding: 6px 12px; min-height: 36px; font-size: 0.86rem; }
main { padding-top: 14px; display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card.us { border-color: var(--us); } .card.them { border-color: var(--them); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 160px; min-width: 0; }
.muted { color: var(--muted); } .small { font-size: 0.82rem; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
label.f { display: grid; gap: 4px; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
select, input[type="text"], input[type="search"] { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-height: 42px; color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; min-height: 42px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--us); color: var(--bg); border-color: var(--us); }
.btn.them { background: var(--them); color: var(--bg); border-color: var(--them); }
.btn.sm { padding: 5px 10px; min-height: 34px; font-size: 0.84rem; }
.btn.big { padding: 14px 16px; min-height: 52px; flex: 1 1 200px; text-align: left; }
.btn small { display: block; font-weight: 400; opacity: 0.9; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.slot { border: 1px solid var(--line); border-radius: 8px; padding: 6px 7px; min-height: 52px; background: var(--surface); position: relative; overflow: hidden; text-align: left; display: block; width: 100%; }
button.slot { cursor: pointer; }
.slot b { font-family: var(--mono); font-size: 0.62rem; color: var(--muted); font-weight: 500; white-space: nowrap; display: block; }
.slot span { display: block; font-weight: 600; font-size: 0.78rem; overflow-wrap: break-word; line-height: 1.15; }
.slot.us { border-left: 4px solid var(--us); } .slot.opp { border-left: 4px solid var(--them); }
.slot.ban span { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); }
.slot.now { outline: 3px solid var(--focus); outline-offset: 1px; }
.slot.sim span { font-style: italic; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--surface2); }
.tag.good { background: var(--good-soft); color: var(--good); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.us { background: var(--us-soft); color: var(--us); } .tag.them { background: var(--them-soft); color: var(--them); }
.tier { display: inline-block; min-width: 24px; text-align: center; font-family: var(--mono); font-weight: 700; border-radius: 6px; padding: 1px 6px; font-size: 0.78rem; background: var(--surface2); }
.tier.tS { background: var(--good-soft); color: var(--good); } .tier.tA { background: var(--us-soft); color: var(--us); } .tier.tB { background: var(--surface2); color: var(--muted); }
.tier.tSSS { background: var(--good); color: var(--bg); } .tier.tF { background: var(--bad); color: var(--bg); }
.tier.tC { background: var(--warn-soft); color: var(--warn); } .tier.tD { background: var(--bad-soft); color: var(--bad); }
.rec { display: grid; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); }
.rec.first { border-color: var(--us); box-shadow: inset 4px 0 0 var(--us); }
.rec.skip { opacity: 0.8; }
.rec h3 { font-size: 1.4rem; }
.bar-score { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar-score i { display: block; height: 100%; background: var(--us); }
details summary { cursor: pointer; font-size: 0.85rem; color: var(--muted); min-height: 28px; }
details.sec { border-top: 1px solid var(--line); padding-block: 4px; }
details.sec > summary { font-weight: 600; color: var(--ink); font-size: 0.95rem; padding-block: 6px; }
ul.r { margin: 6px 0 0; padding-left: 18px; } ul.r li { margin: 2px 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.scroll { overflow-x: auto; }
.meter { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.meter div { background: var(--surface2); border-radius: 8px; padding: 8px 10px; }
.meter b { font-family: var(--mono); font-size: 1.3rem; display: block; } .meter span { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.note h2, .note h3 { margin-top: 10px; } .note ul { padding-left: 18px; }
.warnbox { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
.err { color: var(--bad); font-size: 0.86rem; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 0.82rem; font-weight: 600; min-height: 34px; cursor: pointer; }
.chip.pool { border-color: var(--us); background: var(--us-soft); }
.chip.on { background: var(--us); color: var(--bg); border-color: var(--us); }
.chip.used { opacity: 0.5; text-decoration: line-through; }
button.hl { background: none; border: 0; padding: 0; margin: 0; font-weight: 700; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-height: 48px; cursor: pointer; }
.hrow .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.hlist { display: grid; gap: 6px; }
.prose p { margin: 0.55em 0; } .prose h3 { margin-top: 12px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.cols ul { margin: 4px 0 0; padding-left: 18px; }
.tal { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.tal .lv { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.opt { padding: 6px 0; } .opt + .opt { border-top: 1px dashed var(--line); }
.mk { display: inline-block; width: 1.4em; text-align: center; font-weight: 700; }
.mk.y { color: var(--good); } .mk.m { color: var(--muted); } .mk.n { color: var(--bad); }
code.code { font-family: var(--mono); background: var(--surface2); border-radius: 6px; padding: 3px 8px; word-break: break-all; }
dialog.sheet { border: 0; padding: 0; width: min(760px, 100%); max-width: 100%; height: min(92vh, 100%); max-height: 100%; margin: auto auto 0; border-radius: 14px 14px 0 0; background: var(--bg); color: var(--ink); box-shadow: 0 -6px 28px rgba(0, 0, 0, 0.35); overflow: hidden; }
dialog.sheet[open] { display: flex; flex-direction: column; }
dialog.sheet::backdrop { background: rgba(10, 8, 20, 0.6); }
.sheet-head { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.sheet-body { padding: 12px 14px 32px; overflow-y: auto; flex: 1; display: grid; gap: 12px; align-content: start; }
.sheet-body > * { min-width: 0; }
@media (min-width: 640px) { .board { grid-template-columns: repeat(8, minmax(0, 1fr)); } dialog.sheet { margin: auto; border-radius: 14px; height: min(90vh, 100%); } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<div class="wrap">
  <div class="bar">
    <div class="brand"><h1 id="brand">Draft Room</h1><small id="stamp"></small></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <main id="view"></main>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
<dialog class="sheet" id="picker" aria-labelledby="picker-title"></dialog>

<script>/*DATA*/</script>
<script>/*LIB*/</script>
<script>/*ENGINE*/</script>
<script>
(function () {
  "use strict";
  const P = window.PLAYBOOK, E = window.Engine;
  const LIB = window.LIBRARY || { heroes: {}, maps: {}, guides: [], glossary: [], facts: [], tips: "" };
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const keyOf = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const heroKey = {}; Object.keys(P.heroes).forEach(h => { heroKey[keyOf(h)] = h; });
  const opponents = Object.keys(P.teams).filter(t => t !== P.us.team).sort();
  const SAVE = "pra-draft-room-v1";
  const ROLES = ["Tank", "Bruiser", "Melee Assassin", "Ranged Assassin", "Healer", "Support"];
  let ui = { tab: "draft", opp: (P.meta.next_opponent && P.teams[P.meta.next_opponent]) ? P.meta.next_opponent : opponents[0], side: null, map: null, actions: [], sim: null, msg: "", showAll: false,
    mapview: null, hq: "", hrole: "All", hscope: "general", hpool: false, hsort: "name", ltab: "tips", gq: "", pq: "", prole: "All" };

  function load() { try { const s = JSON.parse(localStorage.getItem(SAVE) || "null"); if (s && P.teams[s.opp]) { ui.opp = s.opp; ui.side = s.side; ui.map = s.map; ui.actions = s.actions || []; ui.tab = s.tab || "draft"; } } catch (e) { /* storage unavailable */ } }
  function save() { try { localStorage.setItem(SAVE, JSON.stringify({ opp: ui.opp, side: ui.side, map: ui.map, actions: ui.actions, tab: ui.tab })); } catch (e) { /* ignore */ } }
  function state() { return { opp: ui.opp, side: ui.side || "first", map: ui.map, actions: ui.actions }; }

  const TABS = [["draft", "Draft"], ["overview", "Prep"], ["heroes", "Heroes"], ["maps", "Maps"], ["learn", "Learn"], ["about", "About"]];
  function renderTabs() {
    $("#tabs").innerHTML = TABS.map(t => `<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${ui.tab === t[0]}">${t[1]}</button>`).join("");
    $("#brand").textContent = (P.us.team.split(" ").map(w => w[0]).join("")) + " Draft Room";
    $("#stamp").textContent = `${P.meta.division} S${P.meta.season} · ${P.meta.games} games · to ${P.meta.newest_date}`;
  }

  // ---------------------------------------------------------------- small renderers and hero helpers
  function md(text) {
    if (!text) return "";
    const out = []; let inList = false;
    const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
    text.split("\n").forEach(line => {
      const t = line.trim();
      if (/^[-*] /.test(t)) { if (!inList) { out.push("<ul>"); inList = true; } out.push("<li>" + inline(t.slice(2)) + "</li>"); return; }
      if (inList) { out.push("</ul>"); inList = false; }
      if (/^## /.test(t)) out.push("<h3>" + inline(t.slice(3)) + "</h3>");
      else if (/^# /.test(t)) out.push("<h2>" + inline(t.slice(2)) + "</h2>");
      else if (t) out.push("<p>" + inline(t) + "</p>");
    });
    if (inList) out.push("</ul>");
    return out.join("");
  }
  const paras = t => String(t || "").split("\n\n").filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
  const rec = E.rec;
  function recText(v) { return v && v[0] ? rec(v) : "0-0"; }
  const lh = h => LIB.heroes[h] || null;
  const roleOf = h => (P.heroes[h] && P.heroes[h].role) || "Unknown";
  const iceRole = r => r === "Bruiser" ? "Offlaner" : r;
  const RANK = { SSS: -1, S: 0, A: 1, B: 2, C: 3, D: 4, F: 5 };
  const rk = t => (t in RANK ? RANK[t] : 9);
  const prettyDate = s => { if (!s) return "unknown"; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/); if (!m) return s; return ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][+m[2] - 1] + " " + (+m[3]) + " " + m[1]; };
  function scopeSlug(scope) { if (scope === "general" || scope === "master") return scope; return LIB.maps[scope] ? LIB.maps[scope].slug : scope; }
  function tierRows(h, scope) {
    const d = lh(h); if (!d) return [];
    if (scope === "fan") return d.fan || [];
    const s = scopeSlug(scope);
    const t = (s === "general" || s === "master") ? d.tiers[s] : (d.tiers.maps[s] || {});
    return Object.values(t || {});
  }
  function mainTier(h, scope) {
    const rows = tierRows(h, scope); if (!rows.length) return null;
    return rows.find(r => r.role === (scope === "fan" ? roleOf(h) : iceRole(roleOf(h)))) || rows.slice().sort((a, b) => rk(a.tier) - rk(b.tier))[0];
  }
  const tierTag = t => t ? `<span class="tier t${t.tier}" title="Icy Veins tier ${t.tier} as ${esc(t.role)}">${t.tier}</span>` : "";
  function poolOf(h) { return P.us.players.filter(p => p.pool[h]).map(p => ({ label: p.label, tier: p.pool[h], tag: p.tag })); }
  const heroBtn = h => `<button class="hl" data-hero="${esc(h)}">${esc(h)}</button>`;
  function chip(h, used, tier) {
    const pl = poolOf(h), gone = used && used.has(h);
    return `<button class="chip ${pl.length ? "pool" : ""} ${gone ? "used" : ""}" data-hero="${esc(h)}">${esc(h)}${tier ? ` <span class="tier t${tier}">${tier}</span>` : ""}${pl.length ? ` <span class="small muted">${pl.map(x => esc(x.label)).join(", ")}</span>` : ""}${gone ? ` <span class="small">(gone)</span>` : ""}</button>`;
  }
  const usedSet = () => ui.side ? E.used(state()) : null;
  const mapNames = () => Array.from(new Set(Object.keys(P.maps).concat(Object.keys(LIB.maps)))).sort();

  // ---------------------------------------------------------------- DRAFT TAB
  function setupCard() {
    const t = E.tossAdvice(ui.opp);
    const pickTxt = t.pick === "first" ? "Take <b>first pick</b>" : t.pick === "map" ? "Take the <b>map pick</b>" : "A <b>toss up</b>";
    const close = Math.abs(t.edgeFirst - t.edgeMap) < 0.12 ? " It is close, so use the notes." : "";
    const h2 = t.h2h;
    return `<details class="card" ${ui.actions.length ? "" : "open"}><summary><b>Setup</b> <span class="muted small">${esc(ui.opp)} · ${ui.side ? (ui.side === "first" ? "we have first pick" : "they have first pick") : "toss not set"} · ${ui.map ? esc(ui.map) : "map not set"}</span></summary>
      <div class="row" style="margin-top:8px">
        <label class="f grow">Opponent<select id="opp">${opponents.map(o => `<option ${o === ui.opp ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>
        <label class="f grow">Map (when known)<select id="map"><option value="">Not set yet</option>${Object.keys(P.maps).sort().map(m => `<option ${m === ui.map ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></label>
      </div>
      <h3 style="margin-top:12px">Coin toss</h3>
      <p class="small muted">If we win the toss: ${pickTxt} against ${esc(ui.opp)}.${close}
        We are ${rec(t.usFirst)} with first pick and ${rec(t.usMap)} with the map pick. They are ${rec(t.themFirst)} with first pick and ${rec(t.themMap)} when they pick the map.
        Head to head: ${rec(h2.first)} when we had first pick, ${rec(h2.map)} when they did.</p>
      <div class="row" style="margin-top:8px">
        <button class="btn big ${ui.side === "first" ? "primary" : ""}" data-side="first">We have first pick<small>They pick the map. We ban 1, 3, 11 and pick 5, 8, 9, 14, 15.</small></button>
        <button class="btn big ${ui.side === "second" ? "primary" : ""}" data-side="second">They have first pick<small>We pick the map. We ban 2, 4, 10 and pick 6, 7, 12, 13, 16.</small></button>
      </div>
    </details>`;
  }

  function boardCard(st) {
    const plan = E.plan(st.side);
    const sim = ui.sim;
    const cells = plan.map((s, i) => {
      const a = st.actions[i] || (sim && sim.actions[i]);
      const now = !sim || st.actions[i] ? i === st.actions.length : false;
      const cls = ["slot", s.team === "us" ? "us" : "opp", s.type, now ? "now" : "", a && !st.actions[i] ? "sim" : ""].join(" ");
      const inner = `<b>${s.slot} ${s.team === "us" ? "US" : "THEM"} ${s.type.toUpperCase()}</b><span>${a && a.hero ? esc(a.hero) : "&nbsp;"}</span>`;
      return a && a.hero && P.heroes[a.hero] ? `<button class="${cls}" data-hero="${esc(a.hero)}" aria-label="Slot ${s.slot}, ${s.team === "us" ? "our" : "their"} ${s.type}, ${esc(a.hero)}. Open hero info.">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
    }).join("");
    return `<section class="card"><div class="board">${cells}</div>
      <div class="row" style="margin-top:10px"><button class="btn" data-act="undo" ${st.actions.length ? "" : "disabled"}>Undo last</button>
      <button class="btn" data-act="sim">${ui.sim ? "Hide projection" : "Project the rest"}</button><button class="btn" data-act="reset">Reset draft</button></div>
      ${ui.sim ? `<p class="small muted">Italic names are a projection: the opponent does what they usually do and we take our top recommendation each time.</p>` : ""}</section>`;
  }

  function recCard(r, i, type, st) {
    const pct = Math.max(4, Math.min(100, r.score * 10));
    const who = (r.who || []).slice(0, 3).map(w => `<span class="tag us">${esc(w.label)} ${esc(w.tier)}</span>`).join(" ");
    const flags = (r.flags || []).map(f => `<span class="tag ${/LOCK NOW/.test(f) ? "bad" : /DO NOT|LEAVE/.test(f) ? "warn" : "good"}">${esc(f)}</span>`).join(" ");
    const reasons = (r.reasons || []).filter(Boolean);
    const skip = (r.flags || []).some(f => /DO NOT|LEAVE/.test(f));
    const tt = st.map ? mainTier(r.hero, st.map) : mainTier(r.hero, "general");
    return `<div class="rec ${i === 0 && !skip ? "first" : ""} ${skip ? "skip" : ""}">
      <div class="row" style="justify-content:space-between"><h3>${esc(r.hero)}</h3><span class="row" style="gap:6px"><span class="small muted">${st.map ? "map tier" : "general tier"}</span>${tierTag(tt)}<span class="num small muted">${r.score.toFixed(1)}</span></span></div>
      <div class="bar-score"><i style="width:${pct}%"></i></div>
      <div class="row">${who} ${flags}</div>
      ${reasons.length ? `<details ${i === 0 ? "open" : ""}><summary>Why (${reasons.length})</summary><ul class="r small">${reasons.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
      <div class="row"><button class="btn primary" data-take="${esc(r.hero)}">${type === "ban" ? "We ban it" : "We pick it"}</button><button class="btn" data-hero="${esc(r.hero)}">Hero info</button></div>
    </div>`;
  }

  function turnCard(st) {
    const slot = E.nextSlot(st);
    if (!slot) return `<section class="card"><h2>Draft complete</h2>${finalCard(st)}</section>`;
    const what = slot.type === "ban" ? "ban" : "pick";
    const ours = slot.team === "us";
    let body = "";
    if (ours) {
      const list = (slot.type === "ban" ? E.recommendBans(st) : E.recommendPicks(st));
      const show = ui.showAll ? list.slice(0, 14) : list.slice(0, 5);
      body = show.map((r, i) => recCard(r, i, slot.type, st)).join("") +
        `<div class="row"><button class="btn" data-act="more">${ui.showAll ? "Show fewer" : "Show more options"}</button></div>`;
    } else {
      const ex = slot.type === "ban" ? E.expectOppBans(st) : null;
      const picks = slot.type === "pick" ? E.expectOppPicks(st).slice(0, 8) : null;
      const chips = (slot.type === "ban" ? (slot.slot <= 4 ? ex.round1 : ex.round2).slice(0, 8) : picks);
      body = `<p class="muted small">${slot.type === "ban" ? `Their usual ${slot.slot <= 4 ? "round one" : "round two"} bans (over ${ex.games} games, ${ex.gamesVsUs} against us). Tap what they actually did.` :
        "Their usual picks at this point. Tap what they actually did."}</p>
        <div class="row">${chips.map(c => `<button class="btn" data-take="${esc(c.hero)}">${esc(c.hero)} <span class="muted small">${slot.type === "ban" ? c.n + (c.vs ? " (" + c.vs + " vs us)" : "") : (c.player ? esc(c.player.tag) : c.g + " games")}</span></button>`).join("")}</div>`;
    }
    return `<section class="card ${ours ? "us" : "them"}">
      <div class="row" style="justify-content:space-between"><h2>Slot ${slot.slot}: ${ours ? "our" : "their"} ${what}</h2><span class="tag ${ours ? "us" : "them"}">${ours ? "US" : "THEM"}</span></div>
      <div style="display:grid;gap:10px;margin-top:10px">${body}</div>
      <div class="row" style="margin-top:12px"><label class="f grow">${ours ? "Pick any other hero" : "Something else"}<input type="text" id="free" list="heroes" placeholder="Type a hero" autocomplete="off"></label>
        <button class="btn ${ours ? "primary" : "them"}" data-act="free">Record</button>
        <button class="btn" data-act="browse">Browse all heroes</button>
        ${slot.type === "ban" ? `<button class="btn" data-take="No Pick">No ban (missed)</button>` : ""}</div>
      <datalist id="heroes">${Object.keys(P.heroes).sort().map(h => `<option value="${esc(h)}">`).join("")}</datalist>
      ${ui.msg ? `<p class="err">${esc(ui.msg)}</p>` : ""}
    </section>`;
  }

  function compCard(st) {
    const c = E.compSummary(st);
    const picks = E.picks(st, "us");
    const asg = E.bestAssign(picks, st.map);
    const theirs = E.picks(st, "opp");
    const rules = E.rulesFor(st).filter(r => r.kind === "note");
    return `<section class="card us"><h3>Our comp</h3>
      <div class="meter" style="margin-top:8px"><div><b>${c.ranged}</b><span>Ranged</span></div><div><b>${c.marksmen}</b><span>Marksmen</span></div><div><b>${c.frontline}</b><span>Front</span></div><div><b>${c.healers}</b><span>Healer</span></div><div><b>${c.highClear}</b><span>Strong clear</span></div><div><b>${c.highDamage}</b><span>Damage dealers</span></div></div>
      <p class="small muted">Blaze is never counted as ranged. Strong clear is 3,500+ minion damage a minute, damage dealer is 2,400+ hero damage a minute (this division).</p>
      ${c.warnings.map(w => `<div class="warnbox" style="margin-top:6px">${esc(w)}</div>`).join("")}
      ${asg.assign.length ? `<table style="margin-top:8px"><tr><th>Player</th><th>Hero</th><th>Evidence</th></tr>${asg.assign.map(a => `<tr><td>${esc(a.label)}</td><td>${heroBtn(a.hero)}</td><td class="small muted">${esc(a.why.slice(0, 2).join("; "))}</td></tr>`).join("")}</table>
      <p class="small muted">This is the best way to hand out the picks so far. Swap the players when the draft ends if a hero fits someone else better.</p>` : ""}
      ${theirs.length ? `<p class="small"><b>Their picks:</b> ${theirs.map(heroBtn).join(", ")}</p>` : ""}
      ${rules.map(r => `<p class="small muted">${esc(r.text)}</p>`).join("")}
    </section>`;
  }

  // What their picks mean for us: Icy Veins counter lists, filtered to heroes still in the draft.
  function intelCard(st) {
    const theirs = E.picks(st, "opp");
    if (!theirs.length) return "";
    const used = E.used(st);
    const rows = theirs.map(h => {
      const d = lh(h), info = P.heroes[h] || {};
      const open = (info.counters || []).filter(c => !used.has(c));
      const mine = open.filter(c => poolOf(c).length), rest = open.filter(c => !poolOf(c).length);
      const t = st.map ? mainTier(h, st.map) : null;
      return `<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px"><div class="row" style="justify-content:space-between"><span>${heroBtn(h)} <span class="muted small">${esc(roleOf(h))}</span></span>${t ? `<span class="small muted">${esc(st.map)} ${tierTag(t)}</span>` : ""}</div>
        ${d && d.weaknesses && d.weaknesses.length ? `<p class="small muted">Weak to: ${esc(d.weaknesses.slice(0, 3).join(", "))}</p>` : ""}
        <p class="small" style="margin-bottom:4px">Icy Veins counters still open:</p>
        <div class="chips">${mine.concat(rest).slice(0, 10).map(c => chip(c, used)).join("") || '<span class="small muted">none left in the list</span>'}</div></div>`;
    }).join("");
    return `<section class="card them"><h3>What their picks mean</h3><p class="small muted">Icy Veins counter lists for each hero they have taken. Heroes in our pools are outlined and show the player. Tap any hero for the detail.</p>${rows}</section>`;
  }

  function buildLine(h) {
    const d = lh(h); if (!d || !d.codes || !d.codes.length) return `<span class="small muted">no build code in the sheet</span>`;
    const best = d.codes.slice().sort((a, b) => (a.flags.length - b.flags.length) || b.date.localeCompare(a.date))[0];
    const flag = best.flags.length ? ` <span class="tag warn">${best.flags.map(f => f === "old" ? "old" : "talents changed").join(", ")}</span>` : "";
    return `<span class="small">${esc(best.label)}, ${esc(prettyDate(best.date))}${flag}</span> <button class="btn sm" data-copy="${esc(best.code)}">Copy code</button>`;
  }

  function summaryText(st) {
    const plan = E.plan(st.side);
    const lines = [`${P.us.team} vs ${st.opp}${st.map ? " on " + st.map : ""}`, st.side === "first" ? "We had first pick." : "They had first pick."];
    st.actions.forEach((a, i) => lines.push(`${a.slot} ${plan[i].team === "us" ? "US" : "THEM"} ${a.type.toUpperCase()}: ${a.hero}`));
    const asg = E.bestAssign(E.picks(st, "us"), st.map);
    if (asg.assign.length) lines.push("Plan: " + asg.assign.map(a => `${a.label} ${a.hero}`).join(", "));
    return lines.join("\n");
  }

  function finalCard(st) {
    const asg = E.bestAssign(E.picks(st, "us"), st.map);
    return `<table><tr><th>Player</th><th>Hero</th><th>Build</th></tr>${asg.assign.map(a => `<tr><td>${esc(a.label)}</td><td>${heroBtn(a.hero)}</td><td>${buildLine(a.hero)} <button class="btn sm" data-hero="${esc(a.hero)}" data-htab="builds">Builds</button></td></tr>`).join("")}</table>
      <p class="small muted">Build codes come from the Icy Veins sheet. A flag means the code is more than a year old, or the Icy talent page changed after it was made. Check the picks in game before you trust it.</p>
      ${st.map ? `<p class="small">Map plan: <button class="btn sm" data-gomap="${esc(st.map)}">Open ${esc(st.map)}</button></p>` : ""}
      <div class="row" style="margin-top:8px"><button class="btn" data-copy-summary="1">Copy draft summary</button></div>`;
  }

  function renderDraft() {
    if (!ui.side) return setupCard() + `<section class="card"><p class="muted">Pick who has first pick to start the draft board.</p></section>`;
    const st = state();
    return setupCard() + turnCard(st) + boardCard(st) + compCard(st) + intelCard(st);
  }

  // ---------------------------------------------------------------- PREP TAB (the opponent)
  function answersCard() {
    const st = E.newDraft(ui.opp, "first", ui.map), th = E.threats(st);
    const top = Object.keys(th).sort((a, b) => th[b].v - th[a].v).slice(0, 8);
    const rows = top.map(h => {
      const info = P.heroes[h] || {}, mine = (info.counters || []).filter(c => poolOf(c).length);
      const who = th[h].rows.slice(0, 2).map(r => `${esc(r.tag)} ${r.w}-${r.g - r.w}`).join(", ");
      return `<tr><td>${heroBtn(h)}<div class="small muted">${who}</div></td><td>${mine.length ? `<div class="chips">${mine.map(c => chip(c)).join("")}</div>` : '<span class="small muted">none in our pools</span>'}</td></tr>`;
    }).join("");
    return `<section class="card us"><h3>Answers in our pools</h3><p class="small muted">Their top heroes by how much they rely on them, and the Icy Veins counters that we can play. Icy lists are general advice, so check the hero page before you lean on one.</p>
      <div class="scroll"><table><tr><th>Their hero</th><th>Counters in our pools</th></tr>${rows}</table></div></section>`;
  }

  function renderOverview() {
    const o = P.teams[ui.opp], t = E.tossAdvice(ui.opp), mp = E.mapPlan(ui.opp), st = E.newDraft(ui.opp, "first", ui.map);
    const ex = E.expectOppBans(st);
    const rules = E.rulesFor({ opp: ui.opp, side: "first", map: ui.map });
    const players = Object.keys(o.players).sort((a, b) => o.players[b].games - o.players[a].games).filter(tag => o.players[tag].games >= 3);
    const lock = [];
    P.us.players.forEach(p => Object.keys(p.pool).forEach(h => { const n = (o.bans_r2[h] || 0); if (n >= 2) lock.push(`${h} (${p.label}): banned in round two ${n} time(s)${o.bans_r2_vs_us && o.bans_r2_vs_us[h] ? ", " + o.bans_r2_vs_us[h] + " against us" : ""}`); }));
    return `<section class="card"><label class="f">Opponent<select id="opp">${opponents.map(x => `<option ${x === ui.opp ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>
      <p><b>${esc(ui.opp)}</b> is ${o.wins}-${o.games - o.wins} this season. First pick ${recText(o.first_pick)}, map pick ${recText(o.map_pick)}.
      ${o.h2h.length ? "Against us: " + o.h2h.map(g => `${esc(g.map)} ${g.won ? "W" : "L"}`).join(", ") + "." : "No games against us yet."}</p></section>
    <section class="card us"><h3>Coin toss</h3><p>If we win it: <b>${t.pick === "first" ? "first pick" : t.pick === "map" ? "map pick" : "either (toss up)"}</b>.
      Our record with first pick ${rec(t.usFirst)}, with map pick ${rec(t.usMap)}; theirs ${rec(t.themFirst)} and ${rec(t.themMap)}. First pick lets us decide who takes the contested heroes; the map pick lets us choose where.</p></section>
    <section class="card"><h3>Maps</h3>
      <p class="small muted">Suggested map bans: <b>${mp.bans.map(esc).join(" and ") || "none yet"}</b>. If we get the map pick: ${mp.picks.map(esc).join(", ")}. Records are this season in this division, so most are 1 to 4 games.</p>
      <div class="scroll"><table><tr><th>Map</th><th>Us</th><th>Them</th><th>They pick</th><th>They ban</th><th></th></tr>
      ${mp.table.sort((a, b) => b.banScore - a.banScore).map(m => `<tr><td><button class="hl" data-gomap="${esc(m.map)}">${esc(m.map)}</button></td><td class="num">${recText(m.us)}</td><td class="num">${recText(m.them)}</td><td class="num">${recText(m.themPicker)}</td><td class="num">${m.theyBan}</td>
        <td>${mp.bans.includes(m.map) ? '<span class="tag bad">ban</span>' : mp.picks.includes(m.map) ? '<span class="tag good">pick</span>' : ""}</td></tr>`).join("")}</table></div></section>
    <section class="card them"><h3>What they ban</h3>
      <p class="small">Round one: ${ex.round1.slice(0, 6).map(x => `${heroBtn(x.hero)} ${x.n}${x.vs ? " (" + x.vs + " vs us)" : ""}`).join(", ") || "none"}</p>
      <p class="small">Round two (slot 10 or 11): ${ex.round2.slice(0, 6).map(x => `${heroBtn(x.hero)} ${x.n}${x.vs ? " (" + x.vs + " vs us)" : ""}`).join(", ") || "none"}</p>
      ${lock.length ? `<p class="small"><b>Heroes of ours they ban late, so lock them early:</b></p><ul class="r small">${lock.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</section>
    ${answersCard()}
    <section class="card them"><h3>Their players</h3><div class="scroll"><table><tr><th>Player</th><th>Heroes this season</th></tr>
      ${players.map(tag => `<tr><td>${esc(tag)}<div class="muted small">rating ${o.players[tag].avg_rating}</div></td><td class="small">${Object.keys(o.players[tag].heroes).slice(0, 6).map(h => { const d = o.players[tag].heroes[h]; return `${heroBtn(h)} ${d.w}-${d.g - d.w}${d.weak ? ' <span class="tag warn">weaker</span>' : ""}`; }).join(", ")}</td></tr>`).join("")}</table></div>
      <p class="small muted">"Weaker" means the player rates clearly lower on that hero than on his others, so banning it may do nothing.</p></section>
    <section class="card"><h3>Rules in play</h3><ul class="r small">${rules.map(r => `<li><b>${esc(r.id)}:</b> ${esc(r.text || r.why)} <span class="muted">(${esc(r.evidence || "")})</span></li>`).join("")}</ul></section>
    ${o.notes ? `<section class="card note"><h3>Notes on ${esc(ui.opp)}</h3>${md(o.notes)}</section>` : ""}`;
  }

  // ---------------------------------------------------------------- HEROES TAB
  function heroRowHtml(h) {
    const d = lh(h), t = mainTier(h, ui.hscope), pl = poolOf(h), div = d && d.division;
    return `<button class="hrow" data-hero="${esc(h)}"><span><b>${esc(h)}</b><br><span class="small muted">${esc(roleOf(h))}</span>${pl.length ? ` ${pl.map(x => `<span class="tag us">${esc(x.label)} ${esc(x.tier)}</span>`).join(" ")}` : ""}</span>
      <span class="meta">${d && d.hp && (d.hp.deep || d.hp.now) ? `<span class="small muted" title="Heroes Profile Storm League win rate, ${d.hp.deep ? "the newest patches together with the last 2.55 patch" : "newest patch"}">HP ${(d.hp.deep || d.hp.now).win}%</span>` : ""}${div && div.g ? `<span class="small muted">${div.g}g ${div.w}w</span>` : ""}${div && div.bans ? `<span class="small muted">${div.bans} bans</span>` : ""}${t ? `${tierTag(t)}<span class="small muted">${esc(t.role)}</span>` : ""}</span></button>`;
  }
  const hpv = (h, k) => { const x = lh(h) && lh(h).hp ? (lh(h).hp.deep || lh(h).hp.now) : null; return x ? x[k] : 0; };
  function heroListHtml() {
    const q = keyOf(ui.hq);
    let names = Object.keys(P.heroes).sort().filter(h => (!q || keyOf(h).includes(q) || keyOf(roleOf(h)).includes(q)) && (ui.hrole === "All" || roleOf(h) === ui.hrole) && (!ui.hpool || poolOf(h).length));
    if (ui.hsort === "tier") names.sort((a, b) => { const ta = mainTier(a, ui.hscope), tb = mainTier(b, ui.hscope); return (ta ? rk(ta.tier) : 9) - (tb ? rk(tb.tier) : 9) || a.localeCompare(b); });
    else if (ui.hsort === "picked") names.sort((a, b) => ((lh(b) && lh(b).division ? lh(b).division.g : 0) - (lh(a) && lh(a).division ? lh(a).division.g : 0)) || a.localeCompare(b));
    else if (ui.hsort === "hpwin") names.sort((a, b) => (hpv(b, "win") - hpv(a, "win")) || a.localeCompare(b));
    else if (ui.hsort === "hpban") names.sort((a, b) => (hpv(b, "ban") - hpv(a, "ban")) || a.localeCompare(b));
    else if (ui.hsort === "banned") names.sort((a, b) => ((lh(b) && lh(b).division ? lh(b).division.bans : 0) - (lh(a) && lh(a).division ? lh(a).division.bans : 0)) || a.localeCompare(b));
    return `<p class="small muted">${names.length} heroes</p><div class="hlist">${names.map(heroRowHtml).join("") || '<p class="muted">No heroes match.</p>'}</div>`;
  }
  function renderHeroes() {
    const scopes = [["general", "Icy general tier list"], ["master", "Icy master tier list (Diamond and up)"], ["fan", "Fan HotS tier list (from the image)"]].concat(Object.keys(P.maps).sort().map(m => [m, "Icy tier list on " + m]));
    return `<section class="card"><div class="row">
        <label class="f grow">Search<input type="search" id="hq" value="${esc(ui.hq)}" placeholder="Hero or role" autocomplete="off"></label>
        <label class="f grow">Sort<select id="hsort">${[["name", "Name"], ["tier", "Tier"], ["picked", "Most picked here"], ["banned", "Most banned here"], ["hpwin", "Heroes Profile win rate"], ["hpban", "Heroes Profile ban rate"]].map(s => `<option value="${s[0]}" ${s[0] === ui.hsort ? "selected" : ""}>${s[1]}</option>`).join("")}</select></label></div>
      <div class="chips" style="margin-top:10px">${["All"].concat(ROLES).map(r => `<button class="chip ${ui.hrole === r ? "on" : ""}" data-hrole="${esc(r)}" aria-pressed="${ui.hrole === r}">${esc(r)}</button>`).join("")}
        <button class="chip ${ui.hpool ? "on" : ""}" data-hpool="1" aria-pressed="${ui.hpool}">Our pools only</button></div>
      <details style="margin-top:8px"><summary>Tier list and how to read this</summary>
        <label class="f" style="margin-top:6px">Tier list shown<select id="hscope">${scopes.map(s => `<option value="${esc(s[0])}" ${s[0] === ui.hscope ? "selected" : ""}>${esc(s[1])}</option>`).join("")}</select></label>
        <p class="small muted">Tier is the Icy Veins tier for the hero's main role. Tap a hero for the overview, builds, talents, abilities, matchups, maps and who on our team plays it. "g" and "w" are games and wins in this division, "bans" is how often it was banned in ${P.meta.games} games. "HP" is the Heroes Profile Storm League win rate over the newest 2.57 patches plus the last 2.55 patch${LIB.hp_meta && LIB.hp_meta.deep ? " (as of " + esc(LIB.hp_meta.deep.asof) + ")" : ""}.</p></details></section>
      <div id="hlist">${heroListHtml()}</div>`;
  }

  // ---------------------------------------------------------------- HERO SHEET
  let sheet = { stack: [], tab: "overview" };
  const STABS = [["overview", "Overview"], ["builds", "Builds"], ["talents", "Talents"], ["abilities", "Abilities"], ["matchups", "Matchups"], ["maps", "Maps"], ["team", "Team"]];
  const noLib = () => `<p class="warnbox">The Icy Veins library has no page for this hero.</p>`;
  function heroTags(h) {
    const g = mainTier(h, "general"), m = mainTier(h, "master"), mp = ui.map ? mainTier(h, ui.map) : null;
    return `<span class="tag">${esc(roleOf(h))}</span> ${g ? `<span class="small">General ${tierTag(g)}</span>` : ""} ${m ? `<span class="small">Master ${tierTag(m)}</span>` : ""} ${(lh(h) && lh(h).fan || []).map(f => `<span class="small" title="Fan HotS tier list${f.check ? ", weak match to confirm" : ""}">Fan ${esc(f.role)} ${tierTag(f)}${f.check ? "?" : ""}</span>`).join(" ")} ${mp ? `<span class="small">${esc(ui.map)} ${tierTag(mp)}</span>` : ""}
      ${poolOf(h).map(x => `<span class="tag us">${esc(x.label)} ${esc(x.tier)}</span>`).join(" ")}`;
  }
  function sOverview(h) {
    const d = lh(h); if (!d) return noLib();
    const div = d.division;
    const bits = [];
    if (div) bits.push(`In this division: picked ${div.g} time${div.g === 1 ? "" : "s"}${div.g ? ` (${div.w} win${div.w === 1 ? "" : "s"})` : ""}, banned in ${div.bans} of ${div.games} games.`);
    const hm = LIB.hp_meta || {}, hpLine = ["now", "deep"].filter(k => d.hp && d.hp[k] && hm[k]).map(k => { const x = d.hp[k], m = hm[k]; return `<p class="small"><b>Heroes Profile, Storm League, ${k === "now" ? "patch " + esc(m.patches[0]) : "patches " + esc(m.patches.join(", "))} (as of ${esc(m.asof)}):</b> win rate ${x.win}% (plus or minus ${x.ci}), pick rate ${x.pick}%, ban rate ${x.ban}%, ${x.games} games. The average hero on that page wins ${m.avg_win}%.</p>`; }).join("");
    return `${bits.length ? `<p class="small">${esc(bits.join(" "))}</p>` : ""}${hpLine}
      <div class="prose">${paras(d.overview)}</div>
      <div class="cols"><div><h3>Strengths</h3><ul>${(d.strengths || []).map(x => `<li>${esc(x)}</li>`).join("") || "<li>none listed</li>"}</ul></div><div><h3>Weaknesses</h3><ul>${(d.weaknesses || []).map(x => `<li>${esc(x)}</li>`).join("") || "<li>none listed</li>"}</ul></div></div>
      ${d.meta_text ? `<div class="prose"><h3>Role in the current meta</h3>${paras(d.meta_text)}</div>` : ""}
      ${d.tips ? `<details class="sec"><summary>Tips and tricks</summary><div class="prose">${paras(d.tips)}</div></details>` : ""}
      <p class="small muted">Icy Veins pages for ${esc(h)}: guide updated ${esc(prettyDate(d.updated.guide))}, talents updated ${esc(prettyDate(d.updated.talents))}.</p>`;
  }
  function flagText(c, d) {
    const out = [];
    if (c.flags.includes("old")) out.push(c.before ? "Icy lists this build as before June 2020." : "This build is more than a year old.");

  function record(hero, st) {
    const key = heroKey[keyOf(hero)];
    if (hero === "No Pick") { E.apply(st, "No Pick"); return true; }
    if (!key) { ui.msg = `"${hero}" is not a hero in the list. Check the spelling.`; return false; }
    if (E.used(st).has(key)) { ui.msg = `${key} is already banned or picked.`; return false; }
    E.apply(st, key); ui.msg = ""; return true;
  }
  function flash(btn, text) { const old = btn.textContent; btn.textContent = text; setTimeout(() => { btn.textContent = old; }, 1600); }
  function copyText(text, btn) {
    const fallback = () => {
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta); flash(btn, ok ? "Copied" : "Select and copy by hand: " + text.slice(0, 40));
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => flash(btn, "Copied"), fallback); else fallback();
  }
  document.addEventListener("click", ev => {
    const dlg = ev.target;
    if (dlg && dlg.tagName === "DIALOG") { closeDialog(dlg.id); return; }  // click on the backdrop
    const b = ev.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    if (d.copy) { copyText(d.copy, b); return; }
    if (d.copySummary) { copyText(summaryText(state()), b); return; }
    if (d.close) { closeDialog(d.close); return; }
    if (d.back) { sheet.stack.pop(); sheet.tab = "overview"; renderSheet(); return; }
    if (d.stab) { sheet.tab = d.stab; renderSheet(); const sb = $("#sbody"); if (sb) sb.scrollTop = 0; return; }
    if (d.take && ev.target.closest("#picker")) { const st = state(); if (record(d.take, st)) { ui.actions = st.actions; ui.sim = null; closeDialog("picker"); closeDialog("sheet"); save(); render(); } return; }
    if (d.hero && !d.take) { openHero(d.hero, d.htab); return; }
    if (d.prole) { ui.prole = d.prole; openPicker(); return; }
    if (d.gomap) { ui.mapview = d.gomap; ui.tab = "maps"; closeDialog("sheet"); window.scrollTo(0, 0); }
    else if (d.setmap) { ui.map = d.setmap; ui.sim = null; }
    else if (d.hrole) { ui.hrole = d.hrole; ui._keepScroll = true; }
    else if (d.hpool) { ui.hpool = !ui.hpool; ui._keepScroll = true; }
    else if (d.ltab) { ui.ltab = d.ltab; }
    else if (d.tab) { ui.tab = d.tab; window.scrollTo(0, 0); }
    else if (d.side) { if (ui.side !== d.side) { ui.actions = []; ui.sim = null; } ui.side = d.side; }
    else if (d.take) { const st = state(); if (record(d.take, st)) { ui.actions = st.actions; ui.sim = null; } }
    else if (d.act === "free") { const v = ($("#free") || {}).value || ""; const st = state(); if (v && record(v, st)) { ui.actions = st.actions; ui.sim = null; } else if (!v) ui.msg = "Type a hero first."; }
    else if (d.act === "browse") { openPicker(); return; }
    else if (d.act === "undo") { ui.actions.pop(); ui.sim = null; ui.msg = ""; }
    else if (d.act === "reset") { ui.actions = []; ui.sim = null; ui.msg = ""; }
    else if (d.act === "more") { ui.showAll = !ui.showAll; }
    else if (d.act === "sim") { ui.sim = ui.sim ? null : E.simulate(state()); }
    else return;
    save(); render();
  });
  document.addEventListener("change", ev => {
    const t = ev.target;
    if (t.id === "opp") { ui.opp = t.value; ui.actions = []; ui.sim = null; }
    else if (t.id === "map") { ui.map = t.value || null; ui.sim = null; }
    else if (t.id === "mapview") { ui.mapview = t.value; }
    else if (t.id === "hscope") { ui.hscope = t.value; }
    else if (t.id === "hsort") { ui.hsort = t.value; }
    else return;
    save(); render();
  });
  document.addEventListener("input", ev => {
    const t = ev.target;
    if (t.id === "hq") { ui.hq = t.value; $("#hlist").innerHTML = heroListHtml(); }
    else if (t.id === "gq") { ui.gq = t.value; $("#glist").innerHTML = glossaryHtml(); }
    else if (t.id === "pq") { ui.pq = t.value; $("#plist").innerHTML = pickerListHtml(); }
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "free") { const b = document.querySelector('[data-act="free"]'); if (b) b.click(); } });
  load(); render();
})();
</script>
